<style>
/* Layout: full-window sunny 3D island (three.js) behind a 1600x900 scaled UI stage; slide cards sit right, the car parks at each chapter's landmark on the left. */
:root{

html,body{height:100%}

.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--c0),var(--c1),var(--c3),var(--c5),var(--c2),var(--c4),var(--c0));display:block}

/* games */
.game{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.gbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gbar .stat{margin-left:auto;display:flex;gap:10px}
.gbar .stat span{background:var(--tint);border-radius:999px;padding:6px 16px;font-family:var(--fn);font-weight:600;font-size:19px}
.garea{flex:1;min-height:0;background:var(--tint);border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:color-mix(in srgb,var(--tint) 90%,transparent);z-index:3;text-align:center;font-size:25px;padding:20px}
.gover .btn{font-size:26px;padding:14px 40px}
.gover h3{margin:0;font-family:var(--fh);font-weight:400;font-size:56px}
.gover[hidden]{display:none!important}
.stroopword{flex:1;display:grid;place-items:center;font-family:var(--fh);font-size:200px;line-height:1;transition:transform .1s}
.stroopbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 16px}
.stroopbtns button{border:0;border-radius:20px;height:96px;font-family:var(--fh);font-size:32px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.flash-ok{animation:fok .3s}.flash-no{animation:fno .3s}
@keyframes fok{50%{background:#c9f0da}}@keyframes fno{50%{background:#ffd2cf}}
.mem{flex:1;display:grid;gap:12px;padding:16px}
.mc{border:0;border-radius:18px;background:transparent;position:relative;padding:0;transition:transform .2s}
.mc:active{transform:scale(.96)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mc .b{background:var(--cc);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28) 0 14%,transparent 15%),radial-gradient(circle at 72% 70%,rgba(255,255,255,.18) 0 18%,transparent 19%)}
.mc .f{background:#fff;font-size:84px;line-height:1;opacity:0;transform:scale(.85)}
.mc .f small{font-family:var(--fh);font-size:28px;color:var(--ink)}
.mc.up .f{opacity:1;transform:none}.mc.up .b{opacity:0}
.mc.got .f{background:#d9f2e4}
.trail{flex:1;position:relative}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.trail .nd{cursor:pointer}
.trail .nd circle{fill:#fff;stroke:var(--cc);stroke-width:4}
.trail .nd text{font-family:var(--fh);font-size:30px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.trail .nd.done circle{fill:var(--cc)}
.trail .nd.done text{fill:#fff}
.trail .nd.bad circle{fill:#ffd2cf}
.market{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14px;padding:16px;min-height:0}
.basket{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px}
.basket .itm{display:flex;align-items:center;gap:14px;font-family:var(--fh);font-size:28px}
.basket .itm i{font-style:normal;font-size:52px}
.basket .itm b{margin-left:auto;font-family:var(--fn);font-weight:600;font-size:30px;background:#fff6dc;border-radius:12px;padding:2px 12px}
.basket .q{font-family:var(--fh);font-size:26px;color:var(--cc);border-top:2px dashed var(--line);padding-top:10px}
.wallet{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coins button{border:0;border-radius:18px;height:70px;font-family:var(--fn);font-weight:700;font-size:28px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.coins .co{background:radial-gradient(circle at 35% 30%,#fff7cf,#e9c25a);border-radius:999px}
.coins .bi{background:linear-gradient(135deg,#d7ecff,#a9cdf5)}
.paid{background:#fff;border-radius:18px;padding:10px 16px;font-size:20px;min-height:84px;display:flex;flex-direction:column;gap:4px}
.paid .sum{font-family:var(--fn);font-weight:700;font-size:34px}
.paid .tok{display:flex;flex-wrap:wrap;gap:4px}
.paid .tok span{background:#fff6dc;border-radius:999px;padding:0 8px;font-family:var(--fn);font-size:15px}
.choices{display:grid;grid-template-columns:1fr;gap:10px;flex:1}
.choices button{border:0;border-radius:18px;background:#fff;font-family:var(--fn);font-size:36px;font-weight:600;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.sort{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px}
.pool button{border:0;background:#fff;border-radius:16px;padding:10px 20px;font-family:var(--fh);font-size:26px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.pool button.sel{background:var(--ink);color:#fff;transform:translateY(-3px)}
.bins{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bin{border:3px dashed color-mix(in srgb,var(--cc) 50%,#fff);background:rgba(255,255,255,.6);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;font-size:22px;color:var(--ink)}
.bin h4{margin:0;font-family:var(--fh);font-weight:400;font-size:30px;color:var(--cc)}
.bin span{background:#fff;border-radius:12px;padding:4px 14px;font-family:var(--fh);font-size:22px}
.recall{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px}
.recall button{border:0;background:#fff;border-radius:18px;font-family:var(--fh);font-size:32px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.recall button.on{background:var(--ink);color:#fff}
.recall.check button.t{background:var(--ok);color:#fff}
.recall.check button.on:not(.t){background:var(--bad);color:#fff}

/* phone / narrow: reading mode */

body.mob .grid,body.mob .flipq,body.mob .qrgrid,body.mob .errs,body.mob .clockwrap,body.mob .market,body.mob .bins{grid-template-columns:1fr!important}
body.mob .words,body.mob .recall{grid-template-columns:repeat(3,1fr)}
body.mob .cst{grid-template-columns:repeat(3,1fr);grid-template-rows:none}
body.mob .flow{flex-direction:column}body.mob .flow .ar{width:auto;transform:rotate(90deg)}
body.mob .combo{grid-template-columns:1fr}
body.mob .tbl{font-size:15px;display:block;overflow-x:auto}
body.mob .tbl td:first-child{white-space:normal}
body.mob .refs{columns:1}
body.mob .garea{min-height:420px}
body.mob .stroopword{font-size:110px}
body.mob .stroopbtns button{height:70px;font-size:22px}
body.mob .bar,body.mob .progress,body.mob #hud{display:none}
body.mob .pad2{height:320px}
body.mob .row{flex-direction:column}
body.mob .ad8 .q{grid-template-columns:28px 1fr}body.mob .ad8 .q .seg{grid-column:1/-1;justify-self:start}
body.mob .stroopbtns{grid-template-columns:1fr 1fr}body.mob .coins{grid-template-columns:repeat(3,1fr)}body.mob .cst div{font-size:16px}
body.mob .agenda .it{grid-template-columns:44px 1fr 60px}
@media (prefers-reduced-motion:reduce){.slide.on .card{animation:none}.mc{transition:none}}
</style></head><body>

<script>
/* ============ chapters & slides ============ */

const CH=[
 {n:'起點',c:'var(--c0)',hex:0xf2558f},
 {n:'認識失智',c:'var(--c1)',hex:0xef5a5a},
 {n:'評估工具',c:'var(--c2)',hex:0x3d6fe0},
 {n:'復健復能',c:'var(--c3)',hex:0xe9a100},
 {n:'認知遊戲',c:'var(--c4)',hex:0x7c4fe0},
 {n:'結語',c:'var(--c5)',hex:0x0f9a9a}
];
const SL=[];

 umbrella:'<svg viewBox="0 0 96 96"><path d="M10 50a38 34 0 0 1 76 0z" fill="#7c4fe0"/><path d="M10 50q9-8 19 0 9-8 19 0 9-8 19 0 9-8 19 0" fill="#9f7cf0"/><path d="M48 50v26q0 8-8 8t-8-8" stroke="#22304a" stroke-width="5" fill="none" stroke-linecap="round"/></svg>',
 piano:'<svg viewBox="0 0 96 96"><rect x="10" y="26" width="76" height="46" rx="6" fill="#22304a"/><g fill="#fff"><rect x="15" y="40" width="10" height="28" rx="2"/><rect x="27" y="40" width="10" height="28" rx="2"/><rect x="39" y="40" width="10" height="28" rx="2"/><rect x="51" y="40" width="10" height="28" rx="2"/><rect x="63" y="40" width="10" height="28" rx="2"/><rect x="75" y="40" width="7" height="28" rx="2"/></g><g fill="#22304a"><rect x="22" y="40" width="6" height="16"/><rect x="34" y="40" width="6" height="16"/><rect x="58" y="40" width="6" height="16"/><rect x="70" y="40" width="6" height="16"/></g></svg>',
 moon:'<svg viewBox="0 0 96 96"><path d="M62 12a36 36 0 1 0 22 52A30 30 0 0 1 62 12z" fill="#ffcf3f"/><circle cx="40" cy="44" r="5" fill="#f0b400"/><circle cx="50" cy="66" r="4" fill="#f0b400"/></svg>'
};

/* ---- 起點 ---- */
S(0,'','',`
 <div class="kicker">東海大學 高齡健康與運動科學研究所 · 專題講座</div>
 <h1>失智症評估<br>及復健復能<span>從篩檢到每天的生活</span></h1>
 <div class="meta">
   <div class="who"><b>鍾孟修 職能治療師</b><br>2026 年 11 月 19 日（四）10:30–11:30<br>語文館 A105</div>
   <div class="qr">${qrImg(PAGES_URL,5)}掃描帶走簡報</div>
 </div>
 <div class="hint">按 <kbd>→</kbd> 開往下一站 · 按 <kbd>D</kbd> 自己開車逛小島</div>`,{cover:true});

S(0,'今天的路線','一小時，開過五個站',`
 <div class="agenda">
  ${[['1','認識失智','台灣有多少人？失智和正常老化差在哪？','10′',1],
     ['2','評估工具','篩檢、診斷、功能、身體：每一關要看什麼','15′',2],
     ['3','復健復能','認知刺激、記憶策略、運動與生活重建','15′',3],
     ['4','認知遊戲','現場玩六個遊戲，看它練到哪一種能力','15′',4],
     ['5','結語','三件帶走的事＋提問','5′',5]].map(a=>`<div class="it" style="--c:var(--c${a[4]});--t:color-mix(in srgb,var(--c${a[4]}) 12%,#fff)"><div class="n">${a[0]}</div><div><h3>${a[1]}</h3><p>${a[2]}</p></div><div class="m">${a[3]}</div></div>`).join('')}
 </div>`);

S(0,'暖身 · 記住它們','先記住這五個詞',`
 <p class="lead">請大家一起唸兩次。講座最後一站會請你回想，這就是「延遲回憶」。</p>
 <div class="words" id="words">
  <div class="word">${ICON.train}火車</div><div class="word">${ICON.apple}蘋果</div><div class="word">${ICON.umbrella}雨傘</div><div class="word">${ICON.piano}鋼琴</div><div class="word">${ICON.moon}月亮</div>
 </div>
 <div class="row" style="align-items:center"><button class="btn cc" onclick="document.getElementById('words').classList.toggle('hide')">蓋起來 / 打開</button><span class="src" style="font-size:17px">很多認知篩檢（Mini-Cog、ICOPE、MoCA）都用「記幾個詞，過幾分鐘再問」的設計。</span></div>`);

/* ---- 認識失智 ---- */
S(1,'認識失智 · 台灣現況','65 歲以上，每 100 人約有 8 位',`
 <div class="row f1">
  <div class="col" style="flex:0 0 330px">
   <div class="tile solid f1" style="justify-content:center"><span class="k">社區失智盛行率</span><span class="big" style="color:#fff;font-size:120px">7.99<small style="font-size:50px">%</small></span><p>109–112 年全國社區失智症流行病學調查（65 歲以上）</p></div>
   <div class="grid g2" style="flex:0 0 auto"><div class="tile"><span class="k">女性</span><span class="big" style="font-size:44px">9.36%</span></div><div class="tile"><span class="k">男性</span><span class="big" style="font-size:44px">6.35%</span></div></div>
  </div>
  <div class="col f1">
   <div class="tile f1">
    <h3>失智類型占比</h3>
    <div class="bars">
     <div class="barrow"><span>阿茲海默型</span><span class="tr"><i style="width:56.88%"></i></span><span class="v">56.88%</span></div>
     <div class="barrow"><span>血管型</span><span class="tr"><i style="width:22.91%"></i></span><span class="v">22.91%</span></div>
     <div class="barrow"><span>巴金森氏症失智</span><span class="tr"><i style="width:7.12%"></i></span><span class="v">7.12%</span></div>
     <div class="barrow"><span>其他</span><span class="tr"><i style="width:13.09%;opacity:.45"></i></span><span class="v">13.09%</span></div>
    </div>
    <p>年紀越大盛行率越高；多數人住在社區，不在機構。<span class="hl">這也是運動、職能、護理人員在社區最常遇到的族群。</span></p>
   </div>
  </div>
 </div>
 <div class="src">資料：衛生福利部，全國社區失智症流行病學調查結果（國家衛生研究院執行，2024 年 3 月公布）。「其他」為 100% 減去前三項。</div>`);

S(1,'認識失智 · 定義','失智症＝認知退步＋影響生活',`
 <div class="spectrum"><div style="background:#eaf7ef">正常老化</div><div style="background:#fff1c9">輕度認知障礙 MCI</div><div style="background:#ffd9d6">失智症：輕度 → 中度 → 重度</div></div>
 <div class="grid g2">
  <div class="tile"><span class="k">Mild NCD · 輕度認知障礙</span><h3>退步了，但還能自己過日子</h3><ul class="dots"><li>一個以上認知領域比以前差，自己或家人察覺</li><li>測驗分數低於同年齡、同教育程度</li><li>複雜事務（理財、服藥）還能獨立，只是更費力或要靠筆記</li></ul></div>
  <div class="tile solid"><span class="k">Major NCD · 失智症</span><h3>退步到需要別人幫忙</h3><ul class="dots"><li>一個以上認知領域明顯退步</li><li><b>日常生活的獨立性受到影響</b>，至少複雜活動要協助</li><li>不是只發生在譫妄期間，也不能用憂鬱等其他精神疾病解釋</li></ul></div>
 </div>
 <div class="note">判斷的關鍵不在「分數多低」，而在「生活有沒有被影響」。這正是評估日常功能的理由。</div>
 <div class="src">依 DSM-5 神經認知障礙症（Neurocognitive Disorders）診斷準則整理。</div>`);

S(1,'認識失智 · 六大認知領域','認知不只是「記憶」',`
 <div class="grid g3">

S(1,'認識失智 · 常見類型','不同類型，先壞掉的地方不一樣',`
 <div class="grid g2">
  <div class="tile"><span class="k">Alzheimer's</span><h3>阿茲海默型</h3><p>最常見。近期記憶先退，慢慢擴及語言、定向、視空間；病程漸進。</p></div>
  <div class="tile"><span class="k">Vascular</span><h3>血管型</h3><p>中風或小血管病變後出現，可能階梯式惡化；常見執行功能、處理速度變慢，合併步態問題。</p></div>
  <div class="tile"><span class="k">Lewy body</span><h3>路易氏體</h3><p>認知時好時壞、鮮明的視幻覺、巴金森症狀，容易跌倒；對部分抗精神病藥物很敏感。</p></div>
  <div class="tile"><span class="k">Frontotemporal</span><h3>額顳葉型</h3><p>發病較年輕。先出現個性、行為改變（失去抑制、冷漠）或語言障礙，記憶反而保留較久。</p></div>
 </div>
 <div class="note">實務上常是<b>混合型</b>。對復能來說，知道類型就知道要先保護什麼：路易氏體先管跌倒，額顳葉先處理行為，阿茲海默先建外在記憶系統。</div>`);

S(1,'認識失智 · 病程','用 CDR 看病程，用生活看需要',`
 <div class="grid g4">
  ${[['0.5','疑似／極輕度','偶爾健忘，複雜事務開始吃力','建立記憶輔具、維持運動與社交'],
     ['1','輕度','理財、服藥、交通、購物（IADL）要人幫','簡化流程、藥盒與提醒、陪同外出'],
     ['2','中度','穿衣順序、洗澡（BADL）要提示，可能迷路','任務分析、步驟圖卡、環境標示'],
     ['3','重度','多數 BADL 要協助，行動與吞嚥變差','擺位、轉移位、感官刺激、照顧者訓練']].map(a=>`<div class="tile"><span class="k">CDR</span><span class="big" style="font-size:64px">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p><p style="border-top:2px dashed var(--tint2);padding-top:8px"><b>介入重點</b><br>${a[3]}</p></div>`).join('')}
 </div>
 <div class="src">CDR（Clinical Dementia Rating，臨床失智評估量表）0 = 正常。功能退化大致是 IADL 先、BADL 後。</div>`);

S(1,'認識失智 · 可以預防的部分','14 個可改變的危險因子',`
 <div class="row f1">
  <div class="tile solid" style="flex:0 0 250px;justify-content:center;text-align:center"><span class="big" style="color:#fff;font-size:96px">45<small style="font-size:44px">%</small></span><p>的失智症，理論上可以靠處理這些因子來預防或延後</p></div>
  <div class="grid g3 f1 tight">
   <div class="tile"><span class="k">早年</span><h3>教育</h3><p>受教育較少</p></div>
   <div class="tile"><span class="k">中年</span><h3>身體與血管</h3><p><span class="pill">缺乏運動</span><span class="pill">高血壓</span><span class="pill">糖尿病</span><span class="pill">肥胖</span><span class="pill">高 LDL 膽固醇</span><span class="pill">吸菸</span><span class="pill">過量飲酒</span><span class="pill">聽力損失</span><span class="pill">憂鬱</span><span class="pill">頭部外傷</span></p></div>
   <div class="tile"><span class="k">晚年</span><h3>環境與連結</h3><p><span class="pill">社交孤立</span><span class="pill">空氣污染</span><span class="pill">視力損失</span></p></div>
  </div>
 </div>
 <div class="note">高齡運動科學的強項：運動、血壓、血糖、體重，加上把人帶出門的社交。這幾項都在清單上。</div>
 <div class="src">Livingston G, et al. Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission. Lancet 2024.</div>`);

S(2,'評估工具 · 流程','評估是一條路，不是一張表',`
 <div class="flow">
  ${[['1','察覺','家人、社區據點發現改變','AD8'],['2','篩檢','社區或門診快速篩','SPMSQ · Mini-Cog · ICOPE'],['3','診斷','醫師問病史、抽血、影像','MMSE · MoCA · CASI'],['4','分期','嚴重度','CDR'],['5','功能需求','生活、情緒、照顧者','ADL · IADL · NPI · ZBI'],['6','計畫與追蹤','設目標、定期再評','GAS · 重測']].map((a,i)=>`${i?'<div class="ar">›</div>':''}<div class="st"><span class="k">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p><p><b>${a[3]}</b></p></div>`).join('')}
 </div>
 <div class="note"><b>篩檢不等於診斷。</b>篩檢異常要轉介神經內科、精神科或失智共同照護中心；診斷由醫師做。職能、物理治療與運動專業最常負責第 5、6 步。</div>`,{wide:true});

S(2,'評估工具 · 面向','一個人要從六個面向看',`
 <div class="grid g3">
  ${[['認知','哪些領域退步？','MMSE、MoCA、CASI、畫時鐘'],['日常功能','做得到 vs 實際有沒有做','巴氏量表、Lawton IADL、觀察式任務'],['行為與情緒','遊走、妄想、憂鬱、睡眠','NPI、老年憂鬱量表 GDS'],['身體','步態、平衡、跌倒、營養、聽力視力','步速、TUG、雙重任務、握力'],['照顧者','累不累？懂不懂？','Zarit 照顧者負荷量表'],['環境與社會','家裡安全嗎？有沒有人陪？','居家訪視、社會資源盤點']].map(a=>`<div class="tile"><h3>${a[0]}</h3><p>${a[1]}</p><p><span class="pill">${a[2]}</span></p></div>`).join('')}
 </div>`);

S(2,'評估工具 · 社區篩檢','四個常用的快速篩檢',`
 <table class="tbl">
  <tr><th>工具</th><th>誰回答</th><th>內容</th><th>時間</th><th>需要進一步評估</th></tr>
  <tr><td>AD8 極早期失智篩檢</td><td>家屬或本人</td><td>8 題「這幾年有沒有改變」</td><td>約 3 分</td><td>≥ 2 分</td></tr>
  <tr><td>SPMSQ 簡易心智狀態問卷</td><td>施測者問長者</td><td>10 題：日期、地點、記憶、連續減 3</td><td>約 5 分</td><td>錯 3 題以上（依教育程度 ±1）</td></tr>
  <tr><td>Mini-Cog</td><td>施測者</td><td>記 3 個詞＋畫時鐘＋回想</td><td>約 3 分</td><td>總分 5 分，&lt; 3 分（部分研究用 &lt; 4）</td></tr>
  <tr><td>ICOPE 認知</td><td>施測者</td><td>記 3 個詞、時間與地點定向、回想</td><td>約 2 分</td><td>任一題答錯</td></tr>
 </table>
 <div class="note">SPMSQ 也是長照照管評估會用到的工具；ICOPE（WHO 長者功能整合照護）是國健署推動的長者功能評估，認知是六大功能之一。</div>`,{wide:true});

S(2,'評估工具 · AD8 試填','AD8：問的是「改變」',`
 <p class="lead">想一位你熟悉的長輩，跟幾年前比，以下是否有改變？</p>
 <div class="ad8" id="ad8">
  ${['判斷力上的困難（例如落入圈套或騙局、財務上不好的決定）','對活動和嗜好的興趣降低','重複相同的問題、故事和陳述','在學習如何使用工具、電器或小器具上有困難','忘記正確的月份和年份','處理複雜的財務上有困難（例如繳費、所得稅）','記住約會的時間有困難','有持續的思考和記憶方面的問題'].map((q,i)=>`<div class="q"><span class="n">${i+1}</span><span>${q}</span><span class="seg"><button class="yes" data-v="1">是，有改變</button><button data-v="0">沒有</button><button data-v="0">不知道</button></span></div>`).join('')}
 </div>
 <div class="score"><span class="big" id="ad8s">0</span><span id="ad8t">分。勾「是，有改變」才算 1 分；≥ 2 分建議進一步評估。</span></div>`,{wide:true,init:initAD8});

S(2,'評估工具 · 臨床量表','醫院常見的四個量表',`
 <div class="grid g2">
  <div class="tile"><span class="k">MMSE · 30 分</span><h3>簡短智能測驗</h3><p>定向、記憶、注意力與計算、語言、建構。用得最久、最普遍；受教育程度影響大，對輕微退步較不敏感。</p></div>
  <div class="tile"><span class="k">MoCA · 30 分</span><h3>蒙特利爾認知評估</h3><p>多了執行功能（連線、畫時鐘）、視空間與延遲回憶，對 MCI 比較敏感。原版切點 26 分，教育 ≤ 12 年加 1 分；施測需完成官方訓練認證。</p></div>
  <div class="tile"><span class="k">CASI · 100 分</span><h3>認知能力篩檢測驗</h3><p>涵蓋九個認知領域，可換算出 MMSE 分數；台灣研究與門診常用。</p></div>
  <div class="tile solid"><span class="k">CDR · 0 到 3</span><h3>臨床失智評估量表</h3><p>訪談本人與家屬，看記憶、定向、判斷、社區事務、家居嗜好、自我照顧六個面向，用來<b>分期</b>，身障鑑定也會用。</p></div>
 </div>
 <div class="src">量表多有版權與施測規範，請使用正式授權版本並接受訓練後施測。</div>`);

S(2,'評估工具 · 日常功能','先看 IADL：最早出問題的地方',`
 <div class="grid g2">
  <div class="tile"><span class="k">BADL · 巴氏量表 0–100</span><h3>基本日常生活</h3><p><span class="pill">進食</span><span class="pill">移位</span><span class="pill">個人衛生</span><span class="pill">如廁</span><span class="pill">洗澡</span><span class="pill">平地走動</span><span class="pill">上下樓梯</span><span class="pill">穿脫衣褲鞋襪</span><span class="pill">大便控制</span><span class="pill">小便控制</span></p><p>中度以後才明顯下降。</p></div>

S(2,'評估工具 · 行為與照顧者','也要評估行為，以及照顧的人',`
 <div class="row f1">
  <div class="tile f1"><span class="k">NPI 神經精神量表 · 12 項</span><h3>行為與心理症狀（BPSD）</h3>
   <div class="npi">${['妄想','幻覺','激動／攻擊','憂鬱','焦慮','欣快','冷漠','去抑制','易怒','異常動作行為','夜間行為','食慾改變'].map(x=>`<span>${x}</span>`).join('')}</div>

S(2,'評估工具 · 案例練習','陳阿公，79 歲：你會用哪些評估？',`
 <div class="note" style="font-size:21px">退休公車司機，和太太同住。太太說近半年他<b>常重複問同一件事</b>、<b>忘記吃藥</b>，上個月<b>兩次搭錯公車</b>。阿公說：「我沒事啦。」散步速度比以前慢。</div>

 </div>
 <div class="row"><button class="btn cc" id="toolsShow">看建議組合</button><span class="src" style="font-size:16px;align-self:center">先點你會選的，再看建議。</span></div>
 <div class="recbox" id="toolsRec" data-ph="1"><span class="ph">先點你會選的工具，再按「看建議組合」。</span><span class="ans" hidden><b>建議：</b>家屬察覺改變先用 <b>AD8</b>；本人否認，用 <b>SPMSQ／Mini-Cog</b> 客觀篩檢，異常轉介醫師確診。他的問題集中在<b>服藥與交通（IADL）</b>，用 Lawton 加上<b>實際做一次服藥流程</b>，看卡在哪一步。走路變慢就測<b>步速與雙重任務</b>。太太是主要照顧者，用 <b>Zarit</b> 了解她的負荷。MoCA 等量表交給門診做即可；BADL 目前可能還沒受影響。</span>
 </div>`,{init:initTools});

/* ---- 復健復能 ---- */
S(3,'復健復能 · 兩個概念','復健和復能，差在哪裡？',`
 <div class="grid g2">
  <div class="tile"><span class="k">Rehabilitation</span><h3>復健</h3><ul class="dots"><li>以<b>能力</b>為主：肌力、平衡、認知功能</li><li>常在醫院、診所、治療室</li><li>治療師主導，練「身體」</li></ul></div>
  <div class="tile solid"><span class="k">Reablement</span><h3>復能</h3><ul class="dots"><li>以<b>生活目標</b>為主：「我想自己去市場」</li><li>在家裡、社區、真實情境</li><li>短期密集，教會長者與家人，之後自己做下去</li></ul></div>
 </div>
 <div class="note">長照 2.0 的「專業服務」由職能治療師、物理治療師等到家，以個案的生活目標擬定復能計畫（如 CA07 IADLs／ADLs 復能照護、CA08 個別化服務計畫）。失智者的目標常是：<b>自己吃藥、自己洗澡、還能去廟口泡茶。</b></div>`);

S(3,'復健復能 · 三種認知介入','認知刺激、訓練、復健：別混在一起',`
 <table class="tbl">
  <tr><th>類型</th><th>做什麼</th><th>形式</th><th>適合誰</th><th>研究證據</th></tr>
  <tr><td>認知刺激<br><small>Cognitive Stimulation</small></td><td>主題活動、討論、懷舊，整體刺激思考與社交</td><td>小團體</td><td>輕度到中度失智</td><td>可改善認知與生活品質，NICE 建議提供（CST）</td></tr>
  <tr><td>認知訓練<br><small>Cognitive Training</small></td><td>標準化練習某種能力，難度漸增（記憶、注意力）</td><td>個人或團體、紙筆或電腦</td><td>健康長者、MCI</td><td>練到的能力會進步，轉移到生活的效果有限</td></tr>
  <tr><td>認知復健<br><small>Cognitive Rehabilitation</small></td><td>針對個人的生活目標，用策略和環境改變去達成</td><td>一對一，在家中</td><td>輕度到中度失智</td><td>GREAT 試驗：目標達成度明顯提升</td></tr>
 </table>
 <div class="src">Clare L, Woods RT. Neuropsychol Rehabil 2004；Clare L, et al. GREAT trial, Alzheimer's &amp; Dementia 2019；NICE NG97（2018）。</div>`,{wide:true});

S(3,'復健復能 · CST 認知刺激治療','CST：每週兩次、七週十四堂',`
 <div class="cst">
  ${['肢體遊戲','聲音','童年','食物','時事','人物與景物','字詞聯想','創作','物品分類','定向','用錢','數字遊戲','文字遊戲','團隊問答'].map((t,i)=>`<div><i>${i+1}</i>${t}</div>`).join('')}
 </div>
 <div class="grid g3" style="flex:0 0 auto">
  <div class="tile"><h3>形式</h3><p>5–8 人，每次 45 分鐘，固定開場歌與團名</p></div>
  <div class="tile"><h3>原則</h3><p>問「意見」不考「事實」：「你覺得哪個市場最熱鬧？」比「今天幾號？」好</p></div>
  <div class="tile"><h3>在地化</h3><p>童年換成灶腳、柑仔店；聲音放台語老歌、市場叫賣聲</p></div>
 </div>
 <div class="src">Spector A, et al. Br J Psychiatry 2003。</div>`);

S(3,'復健復能 · 記憶策略','記憶不好，也能學會新事情',`
 <div class="grid g2 tight">
  <div class="tile"><span class="k">Errorless learning</span><h3>無錯誤學習</h3><p>不要讓他猜。直接給正確答案、一起做對，避免錯誤被記住。</p></div>
  <div class="tile"><span class="k">Spaced retrieval</span><h3>間隔提取</h3><p>答對就把間隔拉長，答錯就給答案、退回上一個間隔（下一頁示範）。</p></div>
  <div class="tile"><span class="k">Vanishing cues</span><h3>逐步減少提示</h3><p>「藥…」→「ㄧ…」→ 自己想起。提示一點一點拿掉。</p></div>
  <div class="tile"><span class="k">Procedural memory</span><h3>動作記憶</h3><p>做比說好記。每天同一時間、同一順序練習，變成習慣。</p></div>
  <div class="tile solid" style="grid-column:span 2"><span class="k">External aids</span><h3>外在記憶輔具：讓環境替大腦記</h3><p>一週藥盒、白板行事曆、大字月曆、門口「出門檢查」卡（鑰匙、錢包、手機）、手機鬧鐘與語音提醒。</p></div>
 </div>`);

S(3,'復健復能 · 任務分析','把一件事拆小：自己泡早餐牛奶',`
 <p class="lead">點每一步切換表現：<b style="color:#11603b">自己做</b> → <b style="color:#7a5600">要提示</b> → <b style="color:#8f2420">要協助</b>。找出卡關的那一步，只補那一步。</p>

/* ============ helpers for slide widgets ============ */
function clockSVG(t){
 let s='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#22304a" stroke-width="3"/>';
 const num=(n,a,r=34)=>{const x=50+Math.sin(a)*r,y=50-Math.cos(a)*r;return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11" font-family="Fredoka,sans-serif" text-anchor="middle" dominant-baseline="central" fill="#22304a">${n}</text>`;};
 if(t==='crowd'){for(let i=1;i<=12;i++)s+=num(i,(i/12)*Math.PI*1.05-0.2,32);}
 else{for(let i=1;i<=12;i++){if(t==='miss'&&(i===4||i===8||i===9))continue;s+=num(t==='miss'&&i===10?'7':i,i/12*Math.PI*2);}}
 if(t==='none'){s+='<text x="50" y="52" font-size="11" text-anchor="middle" fill="#ef5a5a" font-family="Huninn,sans-serif">11:10</text>';}
 else if(t==='pull'){s+='<line x1="50" y1="50" x2="22" y2="38" stroke="#ef5a5a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="36" y2="26" stroke="#ef5a5a" stroke-width="3" stroke-linecap="round"/>';}
 else{s+='<line x1="50" y1="50" x2="40" y2="30" stroke="#22304a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="74" y2="36" stroke="#22304a" stroke-width="3" stroke-linecap="round"/>';}
 return s+'<circle cx="50" cy="50" r="3" fill="#22304a"/></svg>';
}
function segs(root,cb){root.querySelectorAll('.seg[data-g]').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cb&&cb(sg.dataset.g,b.dataset.v);}));}
function segVal(root,g){const b=root.querySelector('.seg[data-g="'+g+'"] button.on');return b?b.dataset.v:null;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');};

function initClock(c){const cv=c.querySelector('#clk');const ctx=cv.getContext('2d');let draw=false,last=null;
 const fit=()=>{const r=cv.getBoundingClientRect();if(!r.width)return;const img=cv.width?ctx.getImageData(0,0,cv.width,cv.height):null;cv.width=r.width*2;cv.height=r.height*2;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#22304a';};
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
 cv.addEventListener('pointerdown',e=>{if(!cv.width||cv.width<10)fit();draw=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
 cv.addEventListener('pointermove',e=>{if(!draw)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
 cv.addEventListener('pointerup',()=>draw=false);
 c.querySelector('#clkClear').onclick=()=>{fit();};
 c.querySelector('#clkCircle').onclick=()=>{fit();ctx.beginPath();ctx.arc(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*0.42,0,Math.PI*2);ctx.stroke();};
 c._onshow=()=>{if(!cv.width||cv.width<10||cv.width===300)fit();};}
function initCues(c){const box=c.querySelector('#cuebox');c.querySelectorAll('.cue').forEach(b=>b.onclick=()=>{c.querySelectorAll('.cue').forEach(x=>x.classList.toggle('on',x===b));box.children[0].textContent='等級 '+b.querySelector('.n').textContent+'：'+b.dataset.t;box.children[1].textContent=b.dataset.say;});}
function initDT(c){const a=c.querySelector('#dt1'),b=c.querySelector('#dt2'),o=c.querySelector('#dtout');const u=()=>{const t1=+a.value,t2=+b.value;if(!(t1>0&&t2>0)){o.textContent='請輸入秒數';return;}const v1=10/t1,v2=10/t2,d=(v1-v2)/v1*100;o.innerHTML=`單任務 <b>${v1.toFixed(2)}</b> m/s · 雙任務 <b>${v2.toFixed(2)}</b> m/s<br>雙重任務成本 <b style="font-size:40px;font-family:var(--fn)">${d.toFixed(0)}%</b>${d>20?'<br>超過 20%，值得追蹤':''}`;};a.oninput=b.oninput=u;u();}

function initSR(c){const base=[0,30,60,120,240,480,960];let mult=.25,idx=0,lastOk=0,timer=null,end=0,dur=0;
 const lad=c.querySelector('#srLad'),msg=c.querySelector('#srMsg'),btns=c.querySelector('#srBtns'),T=c.querySelector('#srT'),arc=c.querySelector('#srArc');
 const lab=s=>s<60?s+'秒':(s/60)+'分';
 const drawL=()=>{lad.innerHTML=base.slice(1).map((s,i)=>`<span class="${i+1===idx?'on':(i+1<=lastOk?'ok':'')}">${lab(s)}</span>`).join('');};
 const setB=h=>{btns.innerHTML=h;};
 const tick=()=>{const left=Math.max(0,end-Date.now());T.textContent=Math.ceil(left/1000);arc.style.strokeDashoffset=276.5*(1-left/dur);if(left<=0){clearInterval(timer);timer=null;ask();}};
 const wait=()=>{idx=Math.min(idx,base.length-1);const sec=base[idx]*mult;dur=sec*1000;end=Date.now()+dur;drawL();msg.textContent='等待 '+lab(base[idx])+(mult<1?'（示範縮短）':'')+'，先聊別的…';setB('<button class="btn alt" id="srSkip">跳過等待</button>');btns.querySelector('#srSkip').onclick=()=>{end=Date.now();};clearInterval(timer);timer=setInterval(tick,100);tick();};
 const ask=()=>{msg.textContent='現在問：「眼鏡放在哪裡？」';setB('<button class="btn" style="background:#1f9d63" id="srY">答對</button><button class="btn" style="background:#d9433f" id="srN">答錯</button>');btns.querySelector('#srY').onclick=()=>{lastOk=idx;if(idx>=base.length-1){msg.textContent='16 分鐘也答對了！下次練習從這個間隔開始。';drawL();setB('<button class="btn cc" id="srGo">再來一次</button>');btns.querySelector('#srGo').onclick=start;return;}idx++;wait();};btns.querySelector('#srN').onclick=()=>{msg.textContent='直接說答案：「電視旁邊的藍色盒子。」請他唸一次。';idx=Math.max(1,lastOk);setB('<button class="btn cc" id="srC">繼續</button>');btns.querySelector('#srC').onclick=wait;};};
 const start=()=>{idx=1;lastOk=0;msg.textContent='先教：「眼鏡放在電視旁邊的藍色盒子。」請他唸一次。';T.textContent='0';arc.style.strokeDashoffset=0;drawL();setB('<button class="btn cc" id="srC">他唸對了，開始計時</button>');btns.querySelector('#srC').onclick=wait;};
 c.querySelector('#srGo').onclick=start;drawL();
 c.querySelector('#srSpeed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;c.querySelectorAll('#srSpeed button').forEach(x=>x.classList.toggle('on',x===b));mult=+b.dataset.m;});}
function initCombo(c){const M=[['坐著原地踏步','坐著交替抬膝','坐著拍手再拍膝'],['站著扶椅子踏步','站著側跨步','站著腳跟腳尖交替'],['直線走 5 公尺','繞椅子走 8 字','走路時跨過地上的線']];
 const C=[['說出 5 種水果','跟著數 1 到 10','說出今天星期幾'],['從 50 倒數','說出 5 個台北的地名','聽到「紅」就拍手'],['從 100 連續減 3','說出「ㄅ」開頭的詞','邊走邊接唱一首老歌']];

 c.querySelector('#cbGo').onclick=go;c.querySelector('#cbLv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;c.querySelectorAll('#cbLv button').forEach(x=>x.classList.toggle('on',x===b));lv=+b.dataset.l;go();});}
function initSteps(c){const L=['自己做','要提示','要協助'];c.querySelectorAll('.step button').forEach(b=>{b.dataset.s=0;b.onclick=()=>{let s=(+b.dataset.s+1)%3;b.dataset.s=s;b.textContent=L[s];b.className=s?'s'+(s+1):'';const hard=[...c.querySelectorAll('.step button')].map((x,i)=>+x.dataset.s?i+1:0).filter(Boolean);c.querySelector('#stepNote').textContent=hard.length?'需要補的步驟：第 '+hard.join('、')+' 步。想想看：改環境（標籤、固定位置、畫線）還是給提示？':'環境改造（固定位置、標籤、杯子畫線）往往比反覆練習更快見效。';};});}

/* ---- games ---- */
function initStroop(c){const COL=[{n:'紅',c:'#e5484d'},{n:'藍',c:'#3d6fe0'},{n:'黃',c:'#d9a000'},{n:'綠',c:'#2f9e5b'}];
 const W=c.querySelector('#stW'),B=c.querySelector('#stB'),O=c.querySelector('#stO'),A=c.querySelector('.garea');let cur=null,score=0,tot=0,t0=0,iv=null;
 B.innerHTML=COL.map((x,i)=>`<button data-i="${i}" style="background:${x.c}">${x.n}色</button>`).join('');
 const next=()=>{const w=Math.random()*4|0;let k=w;if(segVal(c,'lv')==='1'&&Math.random()<.7){do{k=Math.random()*4|0}while(k===w);}cur={w,k};W.textContent=COL[w].n;W.style.color=COL[k].c;};
 const end=()=>{clearInterval(iv);iv=null;O.hidden=false;O.innerHTML=`<h3>${score} 分</h3><span>答對 ${score} / ${tot}（正確率 ${tot?Math.round(score/tot*100):0}%）<br>換成「按字」或「全部一致」，比較看看哪個比較快。這就是 Stroop 效應。</span><button class="btn cc" data-start>再玩一次</button>`;O.querySelector('[data-start]').onclick=start;};
 const start=()=>{score=0;tot=0;O.hidden=true;t0=Date.now();next();c.querySelector('#stS').textContent='0 分';clearInterval(iv);iv=setInterval(()=>{const l=30-(Date.now()-t0)/1000;c.querySelector('#stT').textContent=Math.max(0,Math.ceil(l))+' 秒';if(l<=0)end();},200);};
 B.onclick=e=>{const b=e.target.closest('button');if(!b||!iv)return;const ans=segVal(c,'mode')==='ink'?cur.k:cur.w;tot++;const ok=+b.dataset.i===ans;if(ok)score++;A.classList.remove('flash-ok','flash-no');void A.offsetWidth;A.classList.add(ok?'flash-ok':'flash-no');c.querySelector('#stS').textContent=score+' 分';next();};
 O.querySelector('[data-start]').onclick=start;segs(c);next();}
function initMem(c){const IT=[['🍌','香蕉'],['🍍','鳳梨'],['🍉','西瓜'],['🥭','芒果'],['🍇','葡萄'],['🍊','橘子'],['🍓','草莓'],['🍎','蘋果']];
 const G=c.querySelector('#mmG'),O=c.querySelector('#mmO');let open=[],moves=0,got=0,n=6,lock=false;
 const st=()=>{c.querySelector('#mmM').textContent=moves+' 次';c.querySelector('#mmP').textContent=got+' / '+n+' 對';};
 const start=()=>{n=+segVal(c,'n');const cards=shuffle(IT.slice(0,n).flatMap(x=>[x,x]));const cols=n<=4?4:n<=6?4:4;G.style.gridTemplateColumns=`repeat(${n===6?6:4},1fr)`;G.innerHTML=cards.map(x=>`<button class="mc" data-k="${x[1]}"><span class="b"></span><span class="f">${x[0]}<small>${x[1]}</small></span></button>`).join('');open=[];moves=0;got=0;st();O.hidden=true;
  if(segVal(c,'peek')==='1'){lock=true;G.querySelectorAll('.mc').forEach(m=>m.classList.add('up'));setTimeout(()=>{G.querySelectorAll('.mc').forEach(m=>m.classList.remove('up'));lock=false;},3000);}else lock=false;};
 G.onclick=e=>{const m=e.target.closest('.mc');if(!m||lock||m.classList.contains('up'))return;m.classList.add('up');open.push(m);if(open.length===2){moves++;lock=true;const[a,b]=open;if(a.dataset.k===b.dataset.k){a.classList.add('got');b.classList.add('got');got++;open=[];lock=false;st();if(got===n){setTimeout(()=>{O.hidden=false;O.innerHTML=`<h3>全部找到了！</h3><span>${n} 對用了 ${moves} 次。下次試試「不偷看」或多一點牌。</span><button class="btn cc" data-start>再玩一次</button>`;O.querySelector('[data-start]').onclick=start;},600);}}else{setTimeout(()=>{a.classList.remove('up');b.classList.remove('up');open=[];lock=false;},900);}st();}};
 O.querySelector('[data-start]').onclick=start;segs(c);}
function initTrail(c){const S=c.querySelector('#trS'),A=c.querySelector('#trA'),O=c.querySelector('#trO');const TG='甲乙丙丁戊己庚辛';let seq=[],k=0,err=0,t0=0,iv=null,pts=[];
 const start=()=>{const n=+segVal(c,'n');const mode=segVal(c,'mode');seq=[];for(let i=0;i<n;i++)seq.push(mode==='num'?String(i+1):(i%2?TG[(i-1)/2]:String(i/2+1)));
  const r=A.getBoundingClientRect();const w=r.width||1300,h=r.height||480;S.setAttribute('viewBox',`0 0 ${w} ${h}`);pts=[];let guard=0;
  while(pts.length<n&&guard++<5000){const p=[50+Math.random()*(w-100),46+Math.random()*(h-92)];if(pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>Math.min(110,w/7)))pts.push(p);}
  while(pts.length<n)pts.push([50+Math.random()*(w-100),46+Math.random()*(h-92)]);
