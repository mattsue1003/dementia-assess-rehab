<style>
/* Layout: full-window sunny 3D island (three.js) behind a 1600x900 scaled UI stage; slide cards sit right, the car parks at each chapter's landmark on the left. */
:root{
  --ink:#22304a; --ink2:#4a5874; --paper:#fffdf8; --line:#e6e1d6;

}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky1) 0%,#e4f4ff 55%,var(--sky2) 100%);color:var(--ink);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
#world{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--c2);outline-offset:2px}

/* top bar */
.top{z-index:2;position:absolute;left:36px;top:26px;right:36px;display:flex;align-items:center;gap:18px;pointer-events:none}
.brand{pointer-events:auto;background:var(--paper);border-radius:999px;padding:10px 20px 10px 14px;display:flex;align-items:center;gap:10px;font-family:var(--fh);font-size:20px;box-shadow:0 4px 0 rgba(34,48,74,.12)}
.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--c0),var(--c1),var(--c3),var(--c5),var(--c2),var(--c4),var(--c0));display:block}
.chips{display:flex;gap:8px;pointer-events:auto}
.chip{border:0;background:rgba(255,253,248,.78);border-radius:999px;padding:8px 16px;font-family:var(--fh);font-size:18px;color:var(--ink2);display:flex;align-items:center;gap:8px;transition:background .2s,transform .2s}
.chip b{width:12px;height:12px;border-radius:50%;background:var(--cc)}

/* slides */
#deck{position:absolute;inset:0}

.src{font-size:14px;color:#7a8399;line-height:1.4}
.src a{color:inherit}
.grid{flex:1;display:grid;gap:16px;min-height:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.tile{background:var(--tint);border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;min-width:0}

.row{display:flex;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.f1{flex:1}
.note{background:#fff6dc;border-radius:16px;padding:12px 18px;font-size:19px;line-height:1.5}
.tbl{flex:1;width:100%;border-collapse:separate;border-spacing:0;font-size:21px;line-height:1.45}

.slide[data-ch="3"] .tbl th{color:var(--ink)}
.tbl th:first-child{border-radius:14px 0 0 0}.tbl th:last-child{border-radius:0 14px 0 0}
.tbl td{padding:7px 16px;border-bottom:2px solid var(--line);vertical-align:middle}
.tbl tr:nth-child(even) td{background:var(--tint)}
.tbl td:first-child{font-family:var(--fh);font-size:22px;white-space:nowrap}
.btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-size:20px;font-family:var(--fh);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s}

.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* cover */
.slide.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,253,248,.9) 0,rgba(255,253,248,.72) 40%,rgba(255,253,248,0) 62%);pointer-events:none}

.cover h1{margin:0;font-family:var(--fh);font-weight:400;font-size:112px;line-height:1.06;color:var(--ink);text-shadow:0 6px 0 #fff,0 0 1px #fff;letter-spacing:.01em}

.cover .meta{display:flex;gap:18px;align-items:stretch;margin-top:14px}

.bar{position:absolute;right:40px;bottom:16px;display:flex;gap:10px;align-items:center;pointer-events:auto}

.qrc p{margin:0;font-size:18px;line-height:1.45;color:var(--ink2)}
.fx{flex:1;display:grid;grid-template-columns:600px 1fr;gap:18px;min-height:0}
.vcard{position:relative;flex:1;min-height:200px;border:0;border-radius:22px;background:linear-gradient(135deg,#ffcf3f,#e9a100 60%,#c27e00);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:18px 20px;text-align:left;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.vcard b{font-family:var(--fh);font-weight:400;font-size:30px;position:relative}
.vcard small{font-size:16px;opacity:.85;position:relative}
.vcard .vplay{position:absolute;left:50%;top:42%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.vcard .vplay::after{content:"";position:absolute;left:36px;top:26px;border-left:30px solid #e9a100;border-top:20px solid transparent;border-bottom:20px solid transparent}
.vcard.has-thumb{background-size:cover;background-position:center}
.vcard.has-thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(255,255,255,.92))}
.vcard iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fxt td:first-child{color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
body.mob .fx{grid-template-columns:1fr}
.qrgrid.tools3{grid-template-columns:repeat(3,1fr)}
.qrc.tool{grid-template-columns:1fr;justify-items:center;text-align:center;align-content:space-evenly;padding:20px 18px}
.qrc.tool img{width:150px;height:150px}
.qrc.tool h3{font-size:27px}.qrc.tool p{font-size:18px}
.qrc.tool em{display:inline-block;margin-top:10px;font-style:normal;font-family:var(--fh);font-size:19px;background:var(--cc);color:var(--ink);border-radius:999px;padding:5px 18px}
.refs{margin:0;padding-left:1.3em;font-size:14.5px;line-height:1.36;columns:2;column-gap:36px;flex:1}
.refs li{break-inside:avoid;margin-bottom:6px}

/* games */
.game{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.gbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gbar .stat{margin-left:auto;display:flex;gap:10px}
.gbar .stat span{background:var(--tint);border-radius:999px;padding:6px 16px;font-family:var(--fn);font-weight:600;font-size:19px}
.garea{flex:1;min-height:0;background:var(--tint);border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:color-mix(in srgb,var(--tint) 90%,transparent);z-index:3;text-align:center;font-size:25px;padding:20px}
.gover .btn{font-size:26px;padding:14px 40px}
.gover h3{margin:0;font-family:var(--fh);font-weight:400;font-size:56px}
.gover[hidden]{display:none!important}
.stroopword{flex:1;display:grid;place-items:center;font-family:var(--fh);font-size:200px;line-height:1;transition:transform .1s}
.stroopbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 16px}
.stroopbtns button{border:0;border-radius:20px;height:96px;font-family:var(--fh);font-size:32px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.flash-ok{animation:fok .3s}.flash-no{animation:fno .3s}
@keyframes fok{50%{background:#c9f0da}}@keyframes fno{50%{background:#ffd2cf}}
.mem{flex:1;display:grid;gap:12px;padding:16px}
.mc{border:0;border-radius:18px;background:transparent;position:relative;padding:0;transition:transform .2s}
.mc:active{transform:scale(.96)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mc .b{background:var(--cc);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28) 0 14%,transparent 15%),radial-gradient(circle at 72% 70%,rgba(255,255,255,.18) 0 18%,transparent 19%)}
.mc .f{background:#fff;font-size:84px;line-height:1;opacity:0;transform:scale(.85)}
.mc .f small{font-family:var(--fh);font-size:28px;color:var(--ink)}
.mc.up .f{opacity:1;transform:none}.mc.up .b{opacity:0}
.mc.got .f{background:#d9f2e4}
.trail{flex:1;position:relative}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.trail .nd{cursor:pointer}
.trail .nd circle{fill:#fff;stroke:var(--cc);stroke-width:4}
.trail .nd text{font-family:var(--fh);font-size:30px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.trail .nd.done circle{fill:var(--cc)}
.trail .nd.done text{fill:#fff}
.trail .nd.bad circle{fill:#ffd2cf}
.market{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14px;padding:16px;min-height:0}
.basket{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px}
.basket .itm{display:flex;align-items:center;gap:14px;font-family:var(--fh);font-size:28px}
.basket .itm i{font-style:normal;font-size:52px}
.basket .itm b{margin-left:auto;font-family:var(--fn);font-weight:600;font-size:30px;background:#fff6dc;border-radius:12px;padding:2px 12px}
.basket .q{font-family:var(--fh);font-size:26px;color:var(--cc);border-top:2px dashed var(--line);padding-top:10px}
.wallet{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coins button{border:0;border-radius:18px;height:70px;font-family:var(--fn);font-weight:700;font-size:28px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.coins .co{background:radial-gradient(circle at 35% 30%,#fff7cf,#e9c25a);border-radius:999px}
.coins .bi{background:linear-gradient(135deg,#d7ecff,#a9cdf5)}
.paid{background:#fff;border-radius:18px;padding:10px 16px;font-size:20px;min-height:84px;display:flex;flex-direction:column;gap:4px}
.paid .sum{font-family:var(--fn);font-weight:700;font-size:34px}
.paid .tok{display:flex;flex-wrap:wrap;gap:4px}
.paid .tok span{background:#fff6dc;border-radius:999px;padding:0 8px;font-family:var(--fn);font-size:15px}
.choices{display:grid;grid-template-columns:1fr;gap:10px;flex:1}
.choices button{border:0;border-radius:18px;background:#fff;font-family:var(--fn);font-size:36px;font-weight:600;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.sort{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px}
.pool button{border:0;background:#fff;border-radius:16px;padding:10px 20px;font-family:var(--fh);font-size:26px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.pool button.sel{background:var(--ink);color:#fff;transform:translateY(-3px)}
.bins{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bin{border:3px dashed color-mix(in srgb,var(--cc) 50%,#fff);background:rgba(255,255,255,.6);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;font-size:22px;color:var(--ink)}
.bin h4{margin:0;font-family:var(--fh);font-weight:400;font-size:30px;color:var(--cc)}
.bin span{background:#fff;border-radius:12px;padding:4px 14px;font-family:var(--fh);font-size:22px}
.recall{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px}
.recall button{border:0;background:#fff;border-radius:18px;font-family:var(--fh);font-size:32px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.recall button.on{background:var(--ink);color:#fff}
.recall.check button.t{background:var(--ok);color:#fff}
.recall.check button.on:not(.t){background:var(--bad);color:#fff}

/* phone / narrow: reading mode */
body.mob{overflow:auto}
body.mob #world{opacity:.35;pointer-events:none}
body.mob #ui{box-sizing:border-box;position:relative;transform:none!important;width:100%;height:auto;pointer-events:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
body.mob .top{position:relative;left:0;right:0;top:0;flex-wrap:wrap;margin-bottom:14px}
body.mob .chips{flex-wrap:wrap}
body.mob #deck{position:relative;display:flex;flex-direction:column;gap:20px}
body.mob .slide{position:relative;display:block}
body.mob .card,body.mob .slide.wide .card,body.mob .slide.cover .card{position:relative;left:0;top:0;width:100%;height:auto;padding:22px 18px;animation:none}
body.mob .slide.cover .card{background:rgba(255,253,248,.9);padding:22px 18px;border-radius:26px}
body.mob .cover h1{font-size:46px}body.mob .cover h1 span{font-size:30px}
body.mob .cover .meta{flex-direction:column}
body.mob .card h2{font-size:30px}
body.mob .bd{font-size:17px}
body.mob .grid,body.mob .flipq,body.mob .qrgrid,body.mob .errs,body.mob .clockwrap,body.mob .market,body.mob .bins{grid-template-columns:1fr!important}
body.mob .words,body.mob .recall{grid-template-columns:repeat(3,1fr)}
body.mob .cst{grid-template-columns:repeat(3,1fr);grid-template-rows:none}
body.mob .flow{flex-direction:column}body.mob .flow .ar{width:auto;transform:rotate(90deg)}
body.mob .combo{grid-template-columns:1fr}
body.mob .tbl{font-size:15px;display:block;overflow-x:auto}
body.mob .tbl td:first-child{white-space:normal}
body.mob .refs{columns:1}
body.mob .garea{min-height:420px}
body.mob .stroopword{font-size:110px}
body.mob .stroopbtns button{height:70px;font-size:22px}
body.mob .bar,body.mob .progress,body.mob #hud{display:none}
body.mob .pad2{height:320px}
body.mob .row{flex-direction:column}
body.mob .ad8 .q{grid-template-columns:28px 1fr}body.mob .ad8 .q .seg{grid-column:1/-1;justify-self:start}
body.mob .stroopbtns{grid-template-columns:1fr 1fr}body.mob .coins{grid-template-columns:repeat(3,1fr)}body.mob .cst div{font-size:16px}
body.mob .agenda .it{grid-template-columns:44px 1fr 60px}

/* speaker + fb */
.spk{display:grid;grid-template-columns:300px 1fr;gap:28px;flex:1;min-height:0}
.spk .ph{width:300px;height:300px;border-radius:28px;object-fit:cover;box-shadow:0 8px 0 var(--tint2)}
.fbcard{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;background:#1f4fa8;color:#fff;border-radius:22px;padding:14px;text-decoration:none;box-shadow:0 6px 0 rgba(31,79,168,.25);transition:transform .15s}
.fbcard:hover{transform:translateY(-2px)}
.fbcard img{width:112px;height:112px;background:#fff;border-radius:12px;padding:6px;image-rendering:pixelated}
.fbcard b{display:block;font-family:var(--fh);font-weight:400;font-size:22px;line-height:1.3}
.fbcard small{display:block;font-size:15px;opacity:.88;line-height:1.45;margin-top:2px}
.fbcard em{display:inline-block;margin-top:6px;font-style:normal;font-family:var(--fh);background:#fff;color:#1f4fa8;border-radius:999px;padding:2px 12px;font-size:16px}
.roles{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:8px}
.roles li{background:var(--tint);border-radius:14px;padding:9px 16px;font-size:21px;line-height:1.45}
.roles li b{font-family:var(--fh);font-weight:400}
a.qr{color:inherit;text-decoration:none}
a.qrlink{display:block;border-radius:12px}
a.qrlink:hover,a.qr:hover{outline:3px solid var(--cc);outline-offset:2px}
/* ice-breakers */
.ice{display:grid;grid-template-columns:330px 1fr;gap:22px;flex:1;min-height:0}
.gamecard{background:var(--cc);color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;text-decoration:none;text-align:center;box-shadow:0 7px 0 color-mix(in srgb,var(--cc) 45%,#000 10%)}
.gamecard img{width:190px;height:190px;background:#fff;border-radius:16px;padding:8px;image-rendering:pixelated}
.gamecard b{font-family:var(--fh);font-weight:400;font-size:30px;line-height:1.2}
.gamecard span{font-size:17px;opacity:.92;line-height:1.45}
.gamecard em{font-style:normal;font-family:var(--fh);font-size:21px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 22px}
.gq{background:var(--tint);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.gq>p{margin:0;font-size:22px;line-height:1.5}
.gq .opts{display:flex;gap:10px;flex-wrap:wrap}
.gq .opts button{flex:1;min-width:120px;border:0;border-radius:14px;background:var(--paper);padding:10px 14px;font-family:var(--fh);font-size:21px;color:var(--ink)}
.gq.done .opts button.right{background:var(--ok);color:#fff}
.gq.done .opts button.wrongpick{background:var(--bad);color:#fff}
.gq .why{display:none;font-size:18px;line-height:1.5;color:var(--ink2)}
.gq.done .why{display:block}
/* quiz */
.qz{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.qtop{display:flex;align-items:center;gap:10px}
.qdots{display:flex;gap:8px}
.qdots i{width:16px;height:16px;border-radius:50%;background:var(--tint2)}
.qdots i.on{background:var(--ink)}.qdots i.ok{background:var(--ok)}.qdots i.no{background:var(--bad)}
.qtop .qs{margin-left:auto;font-family:var(--fn);font-weight:600;font-size:20px;background:var(--tint);border-radius:999px;padding:4px 16px}
.qq{font-family:var(--fh);font-size:36px;line-height:1.35;text-wrap:balance}
.qopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.qopts button{border:0;border-radius:20px;background:var(--tint);font-size:29px;line-height:1.35;text-align:left;padding:14px 20px;display:flex;gap:14px;align-items:center;color:var(--ink);font-family:var(--fb);transition:transform .12s}
.qopts button:hover{transform:translateY(-2px)}
.qopts button b{flex:none;width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--fn);font-size:22px;color:var(--cc)}
.qopts button.right{background:var(--ok);color:#fff}.qopts button.wrong{background:var(--bad);color:#fff}
.qopts.locked button{pointer-events:none}
.qopts.locked button:not(.right):not(.wrong){opacity:.55}
.qfb{display:flex;align-items:center;gap:16px;background:#fff6dc;border-radius:18px;padding:12px 18px;font-size:21px;line-height:1.5;min-height:92px;visibility:hidden}
.qfb.on{visibility:visible}
.qfb span{flex:1}
.qsrc{display:block;font-size:15px;color:#7a8399;margin-top:4px}
.qend{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.stamp{width:230px;height:230px;border-radius:50%;border:8px double var(--cc);color:var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);font-family:var(--fh);animation:stampin .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp b{font-size:46px;font-weight:400;line-height:1.1}.stamp small{font-size:20px}
.stamp.fail{border-color:#b9b2a6;color:#8a8376}
@keyframes stampin{from{transform:rotate(-10deg) scale(2.2);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.qend p{margin:0;font-size:24px}
.qend .row{justify-content:center}
.slide.pre .card{--tint:color-mix(in srgb,var(--cc) 14%,#fff)}
/* passport */
.passport{margin-left:auto;display:flex;gap:8px;align-items:center;pointer-events:auto;background:rgba(255,253,248,.85);border-radius:999px;padding:6px 8px 6px 16px;border:0;font-family:var(--fh);font-size:17px;color:var(--ink)}
.passport i{width:30px;height:30px;border-radius:50%;border:2px dashed #b9b2a6;display:grid;place-items:center;font-style:normal;font-family:var(--fn);font-weight:700;font-size:15px;color:#9a9385}
.passport i.got{border:0;background:var(--cc);color:#fff}
.passport .sc{font-family:var(--fn);font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px}
.ppb{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.ppr{display:grid;grid-template-columns:62px 190px 1fr 96px 150px;align-items:center;gap:14px;background:var(--tint);border-radius:18px;padding:10px 16px;font-size:21px}
.ppr .st{width:54px;height:54px;border-radius:50%;border:3px dashed #b9b2a6;display:grid;place-items:center;font-family:var(--fn);font-weight:700;color:#9a9385}
.ppr .st.got{border:0;background:var(--sc);color:#fff;transform:rotate(-8deg)}
.ppr h3{margin:0;font-family:var(--fh);font-weight:400;font-size:26px}
.ppr .tr{height:22px;background:#fff;border-radius:999px;overflow:hidden}.ppr .tr i{display:block;height:100%;background:var(--sc)}
.ppr .v{font-family:var(--fn);font-weight:600;text-align:right}
.ppr button{border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--fh);font-size:18px;padding:8px 0}
.ppsum{background:var(--ink);color:#fff;border-radius:20px;padding:16px 22px;font-size:22px;display:flex;gap:20px;align-items:center}
.ppsum .big{color:#fff;font-size:60px}
/* card map button */
.tomap{position:absolute;right:28px;top:26px;border:0;background:var(--tint);border-radius:999px;padding:6px 16px;font-family:var(--fh);font-size:17px;color:var(--ink)}
.tomap:hover{background:var(--tint2)}
/* map (mind-map of billboards) */
#map{position:absolute;inset:0;display:none;pointer-events:none}
body.mapping #map{display:block}
body.mapping #deck{display:none}
#mapLines{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}
.mhub{display:none}
.mhub small{display:block;font-family:var(--fb);font-size:14px;opacity:.8}
.mcard{position:absolute;width:340px;pointer-events:auto;background:var(--paper);border:4px solid var(--cc);border-radius:20px;box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 35%,transparent),0 18px 40px rgba(34,48,74,.18);overflow:hidden;transition:transform .2s}
.mcard:hover{transform:translateY(-4px)}
.mcard .mh{display:flex;align-items:center;gap:12px;background:var(--cc);color:#fff;border:0;width:100%;padding:7px 14px;text-align:left;font-family:var(--fh);font-size:29px}
.slide[data-ch="3"] .mh,.mcard[data-ch="3"] .mh{color:var(--ink)}
.mcard .mh b{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--cc);display:grid;place-items:center;font-family:var(--fn);font-size:24px;flex:none}
.mcard .mh small{margin-left:auto;font-family:var(--fn);font-size:17px;opacity:.9}
.mcard .mb{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px 4px}
.mcard .mb button{border:0;background:var(--tint);border-radius:999px;padding:3px 9px;font-size:14.5px;color:var(--ink);font-family:var(--fb)}
.mcard .mb button:hover{background:var(--tint2)}
.mcard .mf{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 8px;font-size:14.5px;color:var(--ink2)}
.mcard .mf .ok{color:var(--ok);font-weight:700}
.mcard.next{animation:pulse 1.6s infinite}
.mcard.next::after{content:"下一站";position:absolute;right:0;top:54px;background:var(--ink);color:#fff;font-family:var(--fh);font-size:16px;padding:3px 14px 3px 12px;border-radius:999px 0 0 999px}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 35%,transparent),0 0 0 0 color-mix(in srgb,var(--cc) 50%,transparent)}50%{box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 35%,transparent),0 0 0 14px color-mix(in srgb,var(--cc) 0%,transparent)}}
.maptip{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--paper);border-radius:999px;padding:8px 22px;font-family:var(--fh);font-size:19px;box-shadow:0 4px 0 rgba(34,48,74,.14);white-space:nowrap}
body.mob #map{display:block;position:relative;margin-bottom:20px}
body.mob #mapLines,body.mob .mhub,body.mob .maptip{display:none}
body.mob #mapCards{display:grid;grid-template-columns:1fr;gap:14px}
body.mob .mcard{position:relative;left:auto!important;top:auto!important;width:100%}
body.mob .passport{display:none}
body.mob .spk,body.mob .ice{grid-template-columns:1fr}
body.mob .spk .ph{width:200px;height:200px}
body.mob .qopts{grid-template-columns:1fr}
body.mob .qq{font-size:24px}
body.mob .ppr{grid-template-columns:44px 1fr 70px;font-size:16px}body.mob .ppr .tr,body.mob .ppr button{display:none}
body.mob .tomap{display:none}

/* zoom: enlarge any block in a popup */
#zoom{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(34,48,74,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#zoom.on{display:flex}
#zoom .slide{position:relative;inset:auto;display:block;flex:none}

#zoom .bd{display:block}
#zoom .zx{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:max(20px,env(safe-area-inset-top,0px));width:56px;height:56px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:30px;box-shadow:0 6px 0 rgba(0,0,0,.2);z-index:2}
#zoom .zhint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(255,253,248,.92);border-radius:999px;padding:6px 18px;font-family:var(--fh);font-size:17px;color:var(--ink)}
#zbtn{position:absolute;z-index:6;display:none;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--fh);font-size:16px;padding:5px 12px 5px 9px;box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:auto}
#zbtn svg{width:18px;height:18px}
#zbtn.on{display:inline-flex}
body.zpick .slide.on .zable{outline:3px dashed color-mix(in srgb,var(--cc) 70%,transparent);outline-offset:3px;cursor:zoom-in}
body.zpick .slide.on .zable:hover{outline-style:solid;background-color:color-mix(in srgb,var(--cc) 8%,transparent)}
.bar #bZoom.on{background:var(--ink);color:#fff}
body.mob #zbtn{display:none!important}

.formbtns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:19px;color:var(--ink2)}
.formbtns button{border:0;background:var(--cc);color:#fff;border-radius:999px;padding:8px 20px;font-family:var(--fh);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.slide[data-ch="3"] .formbtns button{color:var(--ink)}
button.formtile{border:0;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--fb);transition:transform .15s}
button.formtile:hover{transform:translateY(-3px);background:var(--tint2)}
button.formtile em{font-style:normal;font-family:var(--fh);font-size:19px;color:var(--cc)}
.offlinks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.offlinks a{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.4}
.offlinks a img{width:76px;height:76px;image-rendering:pixelated;flex:none}
.offlinks a b{display:block;font-family:var(--fh);font-weight:400;font-size:20px}
/* form modal */
#form{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(34,48,74,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#form.on{display:flex}
.fbox{background:var(--paper);border-radius:26px;width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.3);font-size:clamp(16px,1.45vw,22px);--cc:var(--c2);--tint:color-mix(in srgb,var(--c2) 10%,#fff);--tint2:color-mix(in srgb,var(--c2) 22%,#fff)}
.fhead{display:flex;align-items:center;gap:14px;padding:18px 24px;background:var(--cc);color:#fff}
.fhead h3{margin:0;font-family:var(--fh);font-weight:400;font-size:1.6em;flex:1}
.fhead button{border:0;background:#fff;color:var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--fh);font-size:.9em}
.fbody{overflow:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.fintro{background:#fff6dc;border-radius:14px;padding:10px 16px;line-height:1.55}
.fq2{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:center;background:var(--tint);border-radius:14px;padding:8px 10px 8px 14px;line-height:1.45}
.fq2 .n{font-family:var(--fn);font-weight:700;color:var(--cc)}
.fq2 small{display:block;color:var(--ink2);font-size:.82em}
.fopts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.fopts button{border:2px solid var(--tint2);background:#fff;border-radius:12px;padding:5px 12px;font-size:.88em;color:var(--ink);font-family:var(--fb);text-align:left}
.fopts button.on{background:var(--cc);border-color:var(--cc);color:#fff}
.fopts button i{font-style:normal;font-family:var(--fn);font-weight:600;opacity:.75;margin-left:6px}
.ffoot{display:flex;align-items:center;gap:18px;padding:14px 24px;background:var(--ink);color:#fff}
.ffoot .big{color:#fff;font-size:2.2em;white-space:nowrap}
.ffoot span{flex:1;line-height:1.5}
.fsrc{font-size:.75em;color:#7a8399;padding:0 24px 12px;background:var(--paper)}
.fsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.ag .garea{display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;min-height:0}
.tbar{height:12px;background:rgba(255,255,255,.7)}.tbar i{display:block;height:100%;width:0;background:var(--cc)}
.cd{font-family:var(--fn);font-weight:700;font-size:220px;color:var(--cc);line-height:1;animation:pop .6s both}
.sw{font-family:var(--fh);font-size:260px;line-height:1}
.sans{font-family:var(--fh);font-size:34px;color:var(--ink2)}
.nb{font-family:var(--fn);font-weight:700;font-size:280px;line-height:1;color:var(--ink);background:#fff;border-radius:40px;padding:10px 70px;box-shadow:0 10px 0 var(--tint2)}
.clap{font-family:var(--fh);font-size:34px;color:var(--ink2)}.clap.hit{color:#fff;background:var(--bad);padding:6px 26px;border-radius:999px}.clap b{font-size:44px;font-weight:400;margin-right:10px}
.eq{font-family:var(--fn);font-weight:700;font-size:170px;line-height:1;color:var(--ink);white-space:nowrap}
.eq .ea{color:var(--ok)}.eq .ea.q{color:var(--cc)}
.ag .gover{background:var(--tint)}
.ag .gbar .btn{padding:6px 18px;font-size:18px}
.feet{display:flex;gap:30px}.feet i{width:46px;height:70px;border-radius:24px 24px 18px 18px;background:var(--cc);opacity:.25;animation:step .667s infinite}.feet i:last-child{animation-delay:.333s}
@keyframes step{0%,45%{opacity:1;transform:translateY(-12px)}50%,100%{opacity:.25;transform:none}}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(100%,980px)}
.ngrid span{background:#fff;border-radius:18px;display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:66px;height:104px;color:var(--ink);box-shadow:0 4px 0 var(--tint2)}
.ngrid.g44{grid-template-columns:repeat(4,1fr);width:min(100%,820px)}.ngrid.g44 span{height:104px;font-size:70px}
.ngrid.g43{grid-template-columns:repeat(4,1fr);width:min(100%,860px)}.ngrid.g43 span{height:138px;font-size:88px}
.ngrid span.hl{background:var(--bad);color:#fff}
.reveal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-family:var(--fh);font-size:56px;padding:18px 44px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.reveal b{font-family:var(--fn);font-size:90px;color:#ffd44d;margin:0 8px;vertical-align:-6px}
.reveal[hidden]{display:none}
.music .mrow{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:16px;padding:6px 10px 6px 16px;font-size:18px}
.music .mt{flex:1}
.ytbox{width:180px;height:101px;border-radius:10px;overflow:hidden;background:#000}
.ytbox:empty,.ytbox:has(div:empty){display:none}
.ytbox iframe{width:180px;height:101px;border:0}
body.mob .sw{font-size:130px}body.mob .nb{font-size:140px}body.mob .eq{font-size:70px}body.mob .ngrid span,body.mob .ngrid.g43 span,body.mob .ngrid.g44 span{font-size:30px;height:56px}

function GQ(q,opts,a,why){return `<div class="gq" data-a="${a}"><p>${q}</p><div class="opts">${opts.map((o,i)=>`<button data-v="${i}">${o}</button>`).join('')}</div><span class="why">${why}</span></div>`;}
function ICE(ch,tag,title,url,name,desc,steps,qs){S(ch,tag,title,`
 <div class="ice">
  <a class="gamecard" href="${url}" target="_blank" rel="noopener">${qrImg(url,5)}<b>${name}</b><span>${desc}</span><em>點我開啟遊戲 ↗</em></a>

   <div class="tile" style="flex:0 0 auto"><h3>怎麼帶</h3><ol style="margin:0;padding-left:1.2em;font-size:21px;line-height:1.55">${steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>
   ${qs.join('')}
  </div>
 </div>`);}
function QZ(ch,tag,title,qs,o={}){S(ch,tag,title,`<div class="qz"></div>`,Object.assign({init:c=>initQuiz(c,ch,qs,o),quiz:!o.pre,pre:!!o.pre,nq:qs.length},o.extra||{}));}

function S(ch,tag,title,body,o={}){SL.push(Object.assign({ch,tag,title,body},o));}
function qrImg(url,cell=6){try{const q=qrcode(0,'M');q.addData(url);q.make();return '<img alt="QR code" src="'+q.createDataURL(cell,2)+'">';}catch(e){return '';}}

   <div class="grid g2" style="flex:0 0 auto"><div class="tile"><span class="k">女性</span><span class="big" style="font-size:44px">9.36%</span></div><div class="tile"><span class="k">男性</span><span class="big" style="font-size:44px">6.35%</span></div></div>
  </div>
  <div class="col f1">
   <div class="tile f1">
    <h3>失智類型占比</h3>

S(1,'認識失智 · 定義','失智症＝認知退步＋影響生活',`
 <div class="spectrum"><div style="background:#eaf7ef">正常老化</div><div style="background:#fff1c9">輕度認知障礙 MCI</div><div style="background:#ffd9d6">失智症：輕度 → 中度 → 重度</div></div>
 <div class="grid g2">
  <div class="tile"><span class="k">Mild NCD · 輕度認知障礙</span><h3>退步了，但還能自己過日子</h3><ul class="dots"><li>一個以上認知領域比以前差，自己或家人察覺</li><li>測驗分數低於同年齡、同教育程度</li><li>複雜事務（理財、服藥）還能獨立，只是更費力或要靠筆記</li></ul></div>
  <div class="tile solid"><span class="k">Major NCD · 失智症</span><h3>退步到需要別人幫忙</h3><ul class="dots"><li>一個以上認知領域明顯退步</li><li><b>日常生活的獨立性受到影響</b>，至少複雜活動要協助</li><li>不是只發生在譫妄期間，也不能用憂鬱等其他精神疾病解釋</li></ul></div>
 </div>
 <div class="note">判斷的關鍵不在「分數多低」，而在「生活有沒有被影響」。這正是評估日常功能的理由。</div>
 <div class="src">依 DSM-5 神經認知障礙症（Neurocognitive Disorders）診斷準則整理。</div>`);

S(1,'認識失智 · 六大認知領域','認知不只是「記憶」',`
 <div class="grid g3">
  ${[['複雜注意力','Attention','同時聽兩個人講話就亂掉；煮飯被電話打斷就忘了關火'],
     ['執行功能','Executive','規劃一桌菜的順序、做決定、出錯時調整'],
     ['學習與記憶','Memory','剛說過的事又問一次；新學的事記不住'],
     ['語言','Language','叫不出東西名稱，常說「那個、那個」'],
     ['知覺動作','Perceptual-motor','停車對不準、在熟悉路口迷路、用不好工具'],
     ['社會認知','Social cognition','看不懂別人表情、說話不顧場合、個性改變']].map(a=>`<div class="tile"><span class="k">${a[1]}</span><h3>${a[0]}</h3><p>${a[2]}</p></div>`).join('')}
 </div>
 <div class="src">DSM-5 的六個認知領域。評估時要問「哪一個領域、影響到哪件生活事」。</div>`);

 <table class="tbl">

     ['判斷力變差','大熱天穿厚外套、被推銷買一堆','偶爾做了不好的決定'],
     ['抽象思考困難','看不懂帳單、不會用提款機','複雜的事要多想一下'],

S(1,'認識失智 · 小測驗','是老化，還是警訊？',`
 <p class="lead">點選你的判斷，會顯示理由。</p>
 <div class="flipq" id="fq">
  ${[['想不起昨天午餐吃什麼，經人提醒就想起來了。','a','經提醒能想起，是提取比較慢。'],
     ['在住了 30 年的社區迷路，找不到回家的路。','w','熟悉環境迷路：時間地點概念與視空間退步。'],
     ['把錢包放進冰箱，自己也說不出為什麼。','w','東西放在不合常理的位置。'],
     ['一時叫不出老同學的名字，晚上突然想起。','a','話到嘴邊、事後想起，屬正常。'],
     ['同一件事跟鄰居講了三次，每次都像第一次講。','w','近期記憶沒有留下來，是常見早期徵兆。'],
     ['新手機的功能要多學幾次才會。','a','學新科技較慢，但學得會。']].map((q,i)=>`<div class="fq" data-a="${q[1]}"><span>${q[0]}</span><span class="why">${q[2]}</span><div class="ans"><button data-v="a">正常老化</button><button data-v="w">失智警訊</button></div></div>`).join('')}
 </div>`,{init:initFQ});

S(1,'認識失智 · 常見類型','不同類型，先壞掉的地方不一樣',`
 <div class="grid g2">
  <div class="tile"><span class="k">Alzheimer's</span><h3>阿茲海默型</h3><p>最常見。近期記憶先退，慢慢擴及語言、定向、視空間；病程漸進。</p></div>
  <div class="tile"><span class="k">Vascular</span><h3>血管型</h3><p>中風或小血管病變後出現，可能階梯式惡化；常見執行功能、處理速度變慢，合併步態問題。</p></div>
  <div class="tile"><span class="k">Lewy body</span><h3>路易氏體</h3><p>認知時好時壞、鮮明的視幻覺、巴金森症狀，容易跌倒；對部分抗精神病藥物很敏感。</p></div>
  <div class="tile"><span class="k">Frontotemporal</span><h3>額顳葉型</h3><p>發病較年輕。先出現個性、行為改變（失去抑制、冷漠）或語言障礙，記憶反而保留較久。</p></div>
 </div>
 <div class="note">實務上常是<b>混合型</b>。對復能來說，知道類型就知道要先保護什麼：路易氏體先管跌倒，額顳葉先處理行為，阿茲海默先建外在記憶系統。</div>`);

S(1,'認識失智 · 病程','用 CDR 看病程，用生活看需要',`
 <div class="grid g4">
  ${[['0.5','疑似／極輕度','偶爾健忘，複雜事務開始吃力','建立記憶輔具、維持運動與社交'],
     ['1','輕度','理財、服藥、交通、購物（IADL）要人幫','簡化流程、藥盒與提醒、陪同外出'],
     ['2','中度','穿衣順序、洗澡（BADL）要提示，可能迷路','任務分析、步驟圖卡、環境標示'],
     ['3','重度','多數 BADL 要協助，行動與吞嚥變差','擺位、轉移位、感官刺激、照顧者訓練']].map(a=>`<div class="tile"><span class="k">CDR</span><span class="big" style="font-size:64px">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p><p style="border-top:2px dashed var(--tint2);padding-top:8px"><b>介入重點</b><br>${a[3]}</p></div>`).join('')}
 </div>
 <div class="src">CDR（Clinical Dementia Rating，臨床失智評估量表）0 = 正常。功能退化大致是 IADL 先、BADL 後。</div>`);

S(1,'認識失智 · 可以預防的部分','14 個可改變的危險因子',`
 <div class="row f1">
  <div class="tile solid" style="flex:0 0 250px;justify-content:center;text-align:center"><span class="big" style="color:#fff;font-size:96px">45<small style="font-size:44px">%</small></span><p>的失智症，理論上可以靠處理這些因子來預防或延後</p></div>
  <div class="grid g3 f1 tight">
   <div class="tile"><span class="k">早年</span><h3>教育</h3><p>受教育較少</p></div>
   <div class="tile"><span class="k">中年</span><h3>身體與血管</h3><p><span class="pill">缺乏運動</span><span class="pill">高血壓</span><span class="pill">糖尿病</span><span class="pill">肥胖</span><span class="pill">高 LDL 膽固醇</span><span class="pill">吸菸</span><span class="pill">過量飲酒</span><span class="pill">聽力損失</span><span class="pill">憂鬱</span><span class="pill">頭部外傷</span></p></div>
   <div class="tile"><span class="k">晚年</span><h3>環境與連結</h3><p><span class="pill">社交孤立</span><span class="pill">空氣污染</span><span class="pill">視力損失</span></p></div>
  </div>
 </div>
 <div class="note">高齡運動科學的強項：運動、血壓、血糖、體重，加上把人帶出門的社交。這幾項都在清單上。</div>
 <div class="src">Livingston G, et al. Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission. Lancet 2024.</div>`);

S(2,'評估工具 · 流程','評估是一條路，不是一張表',`
 <div class="flow">
  ${[['1','察覺','家人、社區據點發現改變','AD8'],['2','篩檢','社區或門診快速篩','SPMSQ · Mini-Cog · ICOPE'],['3','診斷','醫師問病史、抽血、影像','MMSE · MoCA · CASI'],['4','分期','嚴重度','CDR'],['5','功能需求','生活、情緒、照顧者','ADL · IADL · NPI · ZBI'],['6','計畫與追蹤','設目標、定期再評','GAS · 重測']].map((a,i)=>`${i?'<div class="ar">›</div>':''}<div class="st"><span class="k">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p><p><b>${a[3]}</b></p></div>`).join('')}

S(2,'評估工具 · 社區篩檢','四個常用的快速篩檢',`
 <table class="tbl">
  <tr><th>工具</th><th>誰回答</th><th>內容</th><th>時間</th><th>需要進一步評估</th></tr>
  <tr><td>AD8 極早期失智篩檢</td><td>家屬或本人</td><td>8 題「這幾年有沒有改變」</td><td>約 3 分</td><td>≥ 2 分</td></tr>
  <tr><td>SPMSQ 簡易心智狀態問卷</td><td>施測者問長者</td><td>10 題：日期、地點、記憶、連續減 3</td><td>約 5 分</td><td>錯 3 題以上（依教育程度 ±1）</td></tr>
  <tr><td>Mini-Cog</td><td>施測者</td><td>記 3 個詞＋畫時鐘＋回想</td><td>約 3 分</td><td>總分 5 分，&lt; 3 分（部分研究用 &lt; 4）</td></tr>
  <tr><td>ICOPE 認知</td><td>施測者</td><td>記 3 個詞、時間與地點定向、回想</td><td>約 2 分</td><td>任一題答錯</td></tr>
 </table>
 <div class="formbtns"><span>點開表單，可以直接勾選計分：</span><button data-form="ad8">AD8</button><button data-form="spmsq">SPMSQ</button><button data-form="minicog">Mini-Cog</button><button data-form="icope">ICOPE 認知</button></div>
 <div class="note">SPMSQ 也是長照照管評估會用到的工具；ICOPE（WHO 長者功能整合照護）是國健署推動的長者功能評估，認知是六大功能之一。</div>`,{wide:true});

S(2,'評估工具 · AD8 試填','AD8：問的是「改變」',`
 <p class="lead">想一位你熟悉的長輩，跟幾年前比，以下是否有改變？</p>
 <div class="ad8" id="ad8">
  ${['判斷力上的困難（例如落入圈套或騙局、財務上不好的決定）','對活動和嗜好的興趣降低','重複相同的問題、故事和陳述','在學習如何使用工具、電器或小器具上有困難','忘記正確的月份和年份','處理複雜的財務上有困難（例如繳費、所得稅）','記住約會的時間有困難','有持續的思考和記憶方面的問題'].map((q,i)=>`<div class="q"><span class="n">${i+1}</span><span>${q}</span><span class="seg"><button class="yes" data-v="1">是，有改變</button><button data-v="0">沒有</button><button data-v="0">不知道</button></span></div>`).join('')}
 </div>
 <div class="score"><span class="big" id="ad8s">0</span><span id="ad8t">分。勾「是，有改變」才算 1 分；≥ 2 分建議進一步評估。</span></div>`,{wide:true,init:initAD8});

S(2,'評估工具 · 臨床量表','醫院常見的四個量表',`
 <div class="grid g2">
  <div class="tile"><span class="k">MMSE · 30 分</span><h3>簡短智能測驗</h3><p>定向、記憶、注意力與計算、語言、建構。用得最久、最普遍；受教育程度影響大，對輕微退步較不敏感。</p></div>
  <div class="tile"><span class="k">MoCA · 30 分</span><h3>蒙特利爾認知評估</h3><p>多了執行功能（連線、畫時鐘）、視空間與延遲回憶，對 MCI 比較敏感。原版切點 26 分，教育 ≤ 12 年加 1 分；施測需完成官方訓練認證。</p></div>
  <div class="tile"><span class="k">CASI · 100 分</span><h3>認知能力篩檢測驗</h3><p>涵蓋九個認知領域，可換算出 MMSE 分數；台灣研究與門診常用。</p></div>
  <div class="tile solid"><span class="k">CDR · 0 到 3</span><h3>臨床失智評估量表</h3><p>訪談本人與家屬，看記憶、定向、判斷、社區事務、家居嗜好、自我照顧六個面向，用來<b>分期</b>，身障鑑定也會用。</p></div>
 </div>
 <div class="src">量表多有版權與施測規範，請使用正式授權版本並接受訓練後施測。</div>`);

S(2,'評估工具 · 畫時鐘','畫一個時鐘：一張圖看很多能力',`

S(2,'評估工具 · 日常功能','先看 IADL：最早出問題的地方',`
 <div class="grid g2">
  <div class="tile"><span class="k">BADL · 巴氏量表 0–100</span><h3>基本日常生活</h3><p><span class="pill">進食</span><span class="pill">移位</span><span class="pill">個人衛生</span><span class="pill">如廁</span><span class="pill">洗澡</span><span class="pill">平地走動</span><span class="pill">上下樓梯</span><span class="pill">穿脫衣褲鞋襪</span><span class="pill">大便控制</span><span class="pill">小便控制</span></p><p>中度以後才明顯下降。</p></div>
  <div class="tile solid"><span class="k">IADL · Lawton 8 項</span><h3>工具性日常生活</h3><p><span class="pill" style="background:rgba(255,255,255,.25)">打電話</span><span class="pill" style="background:rgba(255,255,255,.25)">購物</span><span class="pill" style="background:rgba(255,255,255,.25)">備餐</span><span class="pill" style="background:rgba(255,255,255,.25)">家事</span><span class="pill" style="background:rgba(255,255,255,.25)">洗衣</span><span class="pill" style="background:rgba(255,255,255,.25)">外出交通</span><span class="pill" style="background:rgba(255,255,255,.25)">服藥</span><span class="pill" style="background:rgba(255,255,255,.25)">理財</span></p><p><b>服藥、理財、交通</b>常是第一個出錯的。</p></div>
 </div>
 <div class="formbtns"><span>點開表單：</span><button data-form="barthel">巴氏量表</button><button data-form="iadl">Lawton IADL</button></div>
 <div class="note">問卷問的是「能不能」，家人回答常偏高或偏低。最準的方法是<b>請長者實際做一次</b>，看他卡在哪一步（下一頁）。</div>`);

S(2,'評估工具 · 觀察式評估','看他做，記下你給了多少提示',`
 <div class="row f1">
  <div class="cues f1" id="cues">
   ${[['0','不需協助','自己完成'],['1','間接口語引導','「接下來呢？」'],['2','手勢引導','指一指熱水瓶'],['3','直接口語指示','「把熱水倒進杯子。」'],['4','肢體協助','扶著他的手一起倒'],['5','代為完成','照顧者幫他倒']].map(a=>`<button class="cue" data-say="${a[2]}" data-t="${a[1]}"><span class="n">${a[0]}</span><span><b>${a[1]}</b></span></button>`).join('')}
  </div>
  <div class="cuebox f1" id="cuebox">
   <span>任務：泡一杯茶</span>
   <span class="say">點左邊的提示等級</span>
   <span style="font-size:19px;opacity:.85">提示由少到多給。紀錄「起始、組織、順序、安全判斷、完成」各步驟用到的最高等級，就知道該補哪一步。</span>
  </div>
 </div>

S(2,'評估工具 · 行為與照顧者','也要評估行為，以及照顧的人',`
 <div class="row f1">
  <div class="tile f1"><span class="k">NPI 神經精神量表 · 12 項</span><h3>行為與心理症狀（BPSD）</h3>
   <div class="npi">${['妄想','幻覺','激動／攻擊','憂鬱','焦慮','欣快','冷漠','去抑制','易怒','異常動作行為','夜間行為','食慾改變'].map(x=>`<span>${x}</span>`).join('')}</div>
   <p>每項看「頻率 × 嚴重度」，另外記照顧者的困擾程度。</p></div>
  <div class="tile solid" style="flex:0 0 330px"><span class="k">ZBI · 22 題</span><h3>Zarit 照顧者負荷</h3><p>「你覺得因為照顧他，自己的時間不夠嗎？」<br>分數高代表要先幫照顧者減壓：喘息服務、支持團體、轉介資源。</p></div>
 </div>
 <div class="note">BPSD 常是照顧者撐不下去、長者入住機構的主因。復能計畫一定要把照顧者算進團隊。</div>`);

S(2,'評估工具 · 身體與動作','運動科學的主場：走路也在看大腦',`

   <div class="tile"><span class="k">步速</span><h3>&lt; 1.0 m/s</h3><p>6 公尺常速步行，亞洲肌少症共識的切點</p></div>
   <div class="tile"><span class="k">TUG</span><h3>≥ 13.5 秒</h3><p>起身走 3 公尺回來坐下，社區長者跌倒風險較高</p></div>

  </div>

 </div>

S(3,'復健復能 · 兩個概念','復健和復能，差在哪裡？',`
 <div class="grid g2">
  <div class="tile"><span class="k">Rehabilitation</span><h3>復健</h3><ul class="dots"><li>以<b>能力</b>為主：肌力、平衡、認知功能</li><li>常在醫院、診所、治療室</li><li>治療師主導，練「身體」</li></ul></div>
  <div class="tile solid"><span class="k">Reablement</span><h3>復能</h3><ul class="dots"><li>以<b>生活目標</b>為主：「我想自己去市場」</li><li>在家裡、社區、真實情境</li><li>短期密集，教會長者與家人，之後自己做下去</li></ul></div>
 </div>
 <div class="note">長照 2.0 的「專業服務」由職能治療師、物理治療師等到家，以個案的生活目標擬定復能計畫（如 CA07 IADLs／ADLs 復能照護、CA08 個別化服務計畫）。失智者的目標常是：<b>自己吃藥、自己洗澡、還能去廟口泡茶。</b></div>`);

S(3,'復健復能 · 三種認知介入','認知刺激、訓練、復健：別混在一起',`
 <table class="tbl">
  <tr><th>類型</th><th>做什麼</th><th>形式</th><th>適合誰</th><th>研究證據</th></tr>
  <tr><td>認知刺激<br><small>Cognitive Stimulation</small></td><td>主題活動、討論、懷舊，整體刺激思考與社交</td><td>小團體</td><td>輕度到中度失智</td><td>可改善認知與生活品質，NICE 建議提供（CST）</td></tr>
  <tr><td>認知訓練<br><small>Cognitive Training</small></td><td>標準化練習某種能力，難度漸增（記憶、注意力）</td><td>個人或團體、紙筆或電腦</td><td>健康長者、MCI</td><td>練到的能力會進步，轉移到生活的效果有限</td></tr>
  <tr><td>認知復健<br><small>Cognitive Rehabilitation</small></td><td>針對個人的生活目標，用策略和環境改變去達成</td><td>一對一，在家中</td><td>輕度到中度失智</td><td>GREAT 試驗：目標達成度明顯提升</td></tr>

S(3,'復健復能 · CST 認知刺激治療','CST：每週兩次、七週十四堂',`
 <div class="cst">
  ${['肢體遊戲','聲音','童年','食物','時事','人物與景物','字詞聯想','創作','物品分類','定向','用錢','數字遊戲','文字遊戲','團隊問答'].map((t,i)=>`<div><i>${i+1}</i>${t}</div>`).join('')}
 </div>
 <div class="grid g3" style="flex:0 0 auto">
  <div class="tile"><h3>形式</h3><p>5–8 人，每次 45 分鐘，固定開場歌與團名</p></div>
  <div class="tile"><h3>原則</h3><p>問「意見」不考「事實」：「你覺得哪個市場最熱鬧？」比「今天幾號？」好</p></div>
  <div class="tile"><h3>在地化</h3><p>童年換成灶腳、柑仔店；聲音放台語老歌、市場叫賣聲</p></div>
 </div>
 <div class="src">Spector A, et al. Br J Psychiatry 2003。</div>`);

S(3,'復健復能 · 記憶策略','記憶不好，也能學會新事情',`
 <div class="grid g2 tight">
  <div class="tile"><span class="k">Errorless learning</span><h3>無錯誤學習</h3><p>不要讓他猜。直接給正確答案、一起做對，避免錯誤被記住。</p></div>
  <div class="tile"><span class="k">Spaced retrieval</span><h3>間隔提取</h3><p>答對就把間隔拉長，答錯就給答案、退回上一個間隔（下一頁示範）。</p></div>
  <div class="tile"><span class="k">Vanishing cues</span><h3>逐步減少提示</h3><p>「藥…」→「ㄧ…」→ 自己想起。提示一點一點拿掉。</p></div>
  <div class="tile"><span class="k">Procedural memory</span><h3>動作記憶</h3><p>做比說好記。每天同一時間、同一順序練習，變成習慣。</p></div>
  <div class="tile solid" style="grid-column:span 2"><span class="k">External aids</span><h3>外在記憶輔具：讓環境替大腦記</h3><p>一週藥盒、白板行事曆、大字月曆、門口「出門檢查」卡（鑰匙、錢包、手機）、手機鬧鐘與語音提醒。</p></div>
 </div>`);

S(3,'復健復能 · 間隔提取示範','現場示範：間隔提取',`

 const q=()=>{const Q=qs[k];box.innerHTML=`<div class="qtop">${qs.length>1?`<div class="qdots">${qs.map((_,i)=>`<i class="${i<k?(res[i]?'ok':'no'):i===k?'on':''}"></i>`).join('')}</div><span class="qs">第 ${k+1} / ${qs.length} 題 · 答對 ${sc}</span>`:'<span class="pill" style="font-size:18px">答案就藏在這一站</span>'}</div>
  <div class="qq">${Q.q}</div><div class="qopts">${Q.o.map((x,i)=>`<button data-i="${i}"><b>${L[i]}</b><span>${x}</span></button>`).join('')}</div>
  <div class="qfb"><span></span><button class="btn cc">${o.pre?'開始這一站 →':k<qs.length-1?'下一題 →':'看結果 →'}</button></div>`;
  const op=box.querySelector('.qopts'),fb=box.querySelector('.qfb');
  op.onclick=e=>{const b=e.target.closest('button');if(!b||op.classList.contains('locked'))return;const i=+b.dataset.i,ok=i===Q.a;op.classList.add('locked');op.children[Q.a].classList.add('right');if(!ok)b.classList.add('wrong');res[k]=ok;if(ok)sc++;
   fb.querySelector('span').innerHTML=(ok?'<b style="color:var(--ok)">答對了！</b>　':'<b style="color:var(--bad)">差一點。</b>　')+Q.e+(Q.s?'<small class="qsrc">來源：'+Q.s+'</small>':'');fb.classList.add('on');};
  fb.querySelector('button').onclick=()=>{if(o.pre){go(SL.indexOf(SL.find(x=>x.el===c))+1);return;}if(k<qs.length-1){k++;q();}else end();};};
 const end=()=>{const pct=sc/qs.length,ok=pct>=0.6;const prev=PASS[ch];if(!prev||sc>=prev.s){PASS[ch]={s:sc,n:qs.length};savePP();}
  box.innerHTML=`<div class="qend"><div class="stamp ${ok?'':'fail'}"><small>${CH[ch].n}</small><b>${ok?'通關':'再試試'}</b><small>${sc} / ${qs.length}</small></div>
   <p>${ok?'拿到〈'+CH[ch].n+'〉印章！':'答對 6 成就能拿到印章。'}${res.map((r,i)=>r?'':'').join('')}</p>
   <p style="font-size:19px;color:var(--ink2)">${res.map((r,i)=>r?'':'第 '+(i+1)+' 題').filter(Boolean).join('、')||'全部答對，太厲害了'}${res.some(r=>!r)?' 可以回頭再看一次':''}</p>
   <div class="row"><button class="btn alt" data-r>再挑戰一次</button><button class="btn cc" data-m>回地圖，前往下一站</button></div></div>`;
  box.querySelector('[data-r]').onclick=()=>{k=0;sc=0;res=[];q();};box.querySelector('[data-m]').onclick=()=>showMap(ch+1);};
 c._quizReset=()=>{};q();}

 b.innerHTML=QUIZ_CH.map(ch=>{const r=PASS[ch];const n=SL.find(x=>x.quiz&&x.ch===ch).nq;max+=n;const s2=r?r.s:0;tot+=s2;const v=r?r.s/r.n:0;if(v<wv){wv=v;weak=ch;}

  `<div class="ppsum"><span class="big">${tot}<small style="font-size:28px">/${max}</small></span><span>${QUIZ_CH.every(passed)?'四個印章全部集滿，恭喜完成今天的學習！':'集滿四個印章就完成今天的學習。'}${weak&&wv<1?'<br>最值得回去複習的一站：〈'+CH[weak].n+'〉':''}</span></div>`;

function initAG(c,id){const st=c.querySelector('.stage'),bar=c.querySelector('.tbar i'),O=c.querySelector('.gover'),qn=c.querySelector('.qn'),pb=c.querySelector('.agp');
 const G=GAMES[id];let i=0,t0=0,phase='q',paused=false,pAt=0,running=false,cur=null,ctx=null;
 const total=()=>G.total||10;
 const dur=()=>+segVal(c,'spd')||3000;
 const show=()=>{qn.textContent=G.label?G.label(i):'第 '+(i+1)+' / '+total()+' 題';};
 function round(){cur=G.make(i,st,ctx,c)||{};phase='q';t0=performance.now();show();}
 function loop(now){if(!running)return;if(paused){requestAnimationFrame(loop);return;}const el=now-t0,D=phase==='q'?dur():(G.rev||0);
  bar.style.width=(phase==='q'?Math.max(0,1-el/D)*100:0)+'%';if(phase==='q'&&cur.tick)cur.tick(el,D);
  if(el>=D){if(phase==='q'&&G.rev){phase='r';t0=now;cur.reveal&&cur.reveal();}else{i++;if(i>=total()){end();return;}round();}}
  requestAnimationFrame(loop);}
 function start(){O.hidden=true;i=0;paused=false;pb.textContent='暫停';ctx=G.setup?G.setup(c):{};let n=3;st.innerHTML='<div class="cd">3</div>';qn.textContent='預備';G.onStart&&G.onStart(c);
  const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);running=true;round();requestAnimationFrame(loop);}else st.innerHTML='<div class="cd">'+n+'</div>';},800);c._cd=t;}
 function end(){running=false;bar.style.width='0%';G.onEnd&&G.onEnd(c);O.hidden=false;O.innerHTML=`<h3>完成 ${G.judged||total()} 題！</h3><span>${G.endMsg||'大家都很棒！可以換成更快的速度再挑戰一次。'}</span><button class="btn cc" data-start>再玩一次</button>`;O.querySelector('[data-start]').onclick=start;}
 pb.onclick=()=>{if(!running)return;paused=!paused;pb.textContent=paused?'繼續':'暫停';if(paused){pAt=performance.now();G.onPause&&G.onPause(c,true);}else{t0+=performance.now()-pAt;G.onPause&&G.onPause(c,false);}};
 c.querySelector('.ags').onclick=()=>{if(!running)return;t0=-1e9;};
 c._stop=()=>{if(running||c._cd){clearInterval(c._cd);c._cd=null;running=false;G.onEnd&&G.onEnd(c);O.hidden=false;O.querySelector('h3')&&0;}};
 O.querySelector('[data-start]').onclick=start;segs(c);G.init&&G.init(c);st.innerHTML=G.idle?G.idle():'';}
const COLS=[{n:'紅',c:'#e5484d'},{n:'藍',c:'#2f63d6'},{n:'黃',c:'#e0a800'},{n:'綠',c:'#2f9e5b'},{n:'紫',c:'#7c4fe0'}];
const rnd=n=>Math.random()*n|0;
function gridHTML(nums,cls){return '<div class="ngrid'+(cls?' '+cls:'')+'">'+nums.map(n=>`<span data-n="${n}">${n}</span>`).join('')+'</div>';}
const GAMES={
 'g-stroop':{idle:()=>'<div class="sw" style="color:#2f63d6">紅</div>',
  make(i,st,ctx,c){let w=rnd(5),k=w;if(Math.random()<.85){do{k=rnd(5)}while(k===w);}st.innerHTML=`<div class="sw" style="color:${COLS[k].c}">${COLS[w].n}</div><div class="sans" style="visibility:hidden">念：<b style="color:${COLS[k].c}">${COLS[k].n}色</b></div>`;const a=st.querySelector('.sans');
   return{tick:(el,D)=>{if(segVal(c,'ans')==='1'&&el>D*.6)a.style.visibility='visible';}};},
  endMsg:'念錯沒關係！Stroop 效應就是：大腦會先「讀字」，要壓住這個自動反應才能說出顏色。'},
 'g-nback':{total:18,judged:16,label:i=>i<2?'先記住（'+(i+1)+'/2）':'判斷 '+(i-1)+' / 16',
  setup(){/* 16 judged trials, exactly 7 are hits */const hits=new Set(shuffle([...Array(16)].map((_,k)=>k+2)).slice(0,7));const a=[];for(let k=0;k<18;k++){if(hits.has(k))a.push(a[k-2]);else{let v;do{v=1+rnd(9)}while(k>=2&&v===a[k-2]||k>=1&&v===a[k-1]);a.push(v);}}return{a};},
  idle:()=>'<div class="nb">7</div>',
  make(i,st,ctx){const v=ctx.a[i],hit=i>=2&&ctx.a[i-2]===v;st.innerHTML=`<div class="nb">${v}</div><div class="clap" style="visibility:hidden">${hit?'<b>拍手！</b>跟上上個一樣':'不用拍手'}</div>`;const cl=st.querySelector('.clap');if(hit)cl.classList.add('hit');
   return{tick:(el,D)=>{if(i>=2&&el>D*.62)cl.style.visibility='visible';}};},
  endMsg:'2-back 要一邊記、一邊更新，是很好的工作記憶練習。可以改成「和上一個一樣」（1-back）降低難度。'},
 'g-jog':{idle:()=>'<div class="eq">5 + 3 = ?</div>',
  make(i,st,ctx,c){const lv=+segVal(c,'lv');let a,b,op,ans;
   if(lv===1){a=1+rnd(9);b=1+rnd(9);op=Math.random()<.6?'+':'−';if(op==='−'&&b>a)[a,b]=[b,a];}
   else if(lv===2){a=10+rnd(40);b=2+rnd(9);op=Math.random()<.5?'+':'−';}
   else{op=['+','−','×'][rnd(3)];if(op==='×'){a=2+rnd(8);b=2+rnd(8);}else{a=20+rnd(60);b=5+rnd(30);if(op==='−'&&b>a)[a,b]=[b,a];}}
   ans=op==='+'?a+b:op==='−'?a-b:a*b;st.innerHTML=`<div class="eq">${a} ${op} ${b} = <span class="ea q">?</span></div><div class="feet"><i></i><i></i></div>`;const ea=st.querySelector('.ea');
   return{tick:(el,D)=>{if(el>D*.68&&ea.classList.contains('q')){ea.textContent=ans;ea.classList.remove('q');}}};},
  onStart:c=>musicPlay(c,true),onEnd:c=>musicPlay(c,false),onPause:(c,p)=>musicPlay(c,!p),
  endMsg:'超慢跑約每分鐘 180 步、小步輕跑；加上算式就是「動作＋認知」的雙重任務訓練。'},
 'g-miss':{rev:1800,idle:()=>gridHTML([...Array(12)].map((_,k)=>k+1),'g43'),
  make(i,st){const miss=1+rnd(13);const nums=shuffle([...Array(13)].map((_,k)=>k+1).filter(n=>n!==miss));st.innerHTML=gridHTML(nums,'g43')+`<div class="reveal" hidden>少了 <b>${miss}</b></div>`;
   return{reveal:()=>{st.querySelector('.reveal').hidden=false;}};},
  endMsg:'找缺少要邊掃描、邊在心裡排順序，練視覺搜尋和工作記憶。想加難度可以把時間調短。'},
 'g-dup':{rev:1800,idle:()=>gridHTML([...Array(15)].map((_,k)=>k+1).concat([8]),'g44'),
  make(i,st){const dup=1+rnd(15);const nums=shuffle([...Array(15)].map((_,k)=>k+1).concat([dup]));st.innerHTML=gridHTML(nums,'g44')+`<div class="reveal" hidden><b>${dup}</b> 出現兩次</div>`;
   return{reveal:()=>{st.querySelector('.reveal').hidden=false;st.querySelectorAll('.ngrid span[data-n="'+dup+'"]').forEach(x=>x.classList.add('hl'));}};},
  endMsg:'找重複比找缺少更難一點：不能只靠順序，要記住看過哪些數字。'}};

window.mapAssign=(pts)=>{const cx=800,cy=470;{const ang=pts.map(p=>Math.atan2(p[1]-cy,p[0]-cx));const sa=SLOTS.map(sl=>Math.atan2(sl[1]+105-cy,sl[0]+170-cx));let best=null,bc=1e9;
  for(let off=0;off<6;off++)for(const dir of[1,-1]){const ord=[...ang.keys()].sort((a,b)=>ang[a]-ang[b]);const sord=[...sa.keys()].sort((a,b)=>sa[a]-sa[b]);const m={};let cost=0;ord.forEach((st,j)=>{const sl=sord[((dir*j+off)%6+6)%6];m[st]=sl;let d=Math.abs(ang[st]-sa[sl]);if(d>Math.PI)d=2*Math.PI-d;cost+=d;});if(cost<bc){bc=cost;best=m;}}

 const h=document.getElementById('mhub');h.style.left=hub[0]+'px';h.style.top=hub[1]+'px';
 let svg='';pts.forEach((p,i)=>{const sl=SLOTS[slotOf[i]];const ex=sl[0]<800?sl[0]+340:sl[0],ey=sl[1]+100;const col=['#f2558f','#ef5a5a','#3d6fe0','#e9a100','#7c4fe0','#0f9a9a'][i];
