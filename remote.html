<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>簡報遙控器</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&family=Fredoka:wght@600&display=swap">
<style>
:root{--ink:#22304a;--paper:#fffdf8;--line:#e6e1d6;--accent:#3d6fe0;--hot:#ef5a5a;--ok:#1f9d63;
 --fh:'Huninn','Noto Sans TC','PingFang TC',sans-serif;--fb:'Noto Sans TC','PingFang TC',sans-serif;--fn:'Fredoka','Huninn',sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--fb);color:var(--ink);background:linear-gradient(180deg,#bfe4ff,#fff3da);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{min-height:100%;display:flex;flex-direction:column;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:8px}
header b{font-family:var(--fh);font-weight:400;font-size:20px;flex:1}
.st{font-size:13px;border-radius:999px;padding:3px 10px;background:#f1ede4}
.st.ok{background:#d9f2e4;color:#11603b}.st.bad{background:#ffd9d6;color:#8f2420}
.now{background:var(--paper);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 rgba(34,48,74,.1)}
.now small{display:block;color:#5b6884;font-size:13px}
.now strong{display:block;font-family:var(--fh);font-weight:400;font-size:22px;line-height:1.3}
.now .n{font-family:var(--fn);font-size:15px;color:#5b6884}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:0;border-radius:999px;background:rgba(255,253,248,.85);padding:7px 14px;font-family:var(--fh);font-size:15px;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff}
button{font-family:var(--fh);cursor:pointer;touch-action:manipulation}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.nav button{border:0;border-radius:22px;height:88px;font-size:26px;color:#fff;background:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.nav button.prev{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(34,48,74,.14)}
.nav button:active,.tools button:active{transform:translateY(3px)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools button{border:0;border-radius:16px;background:var(--paper);padding:12px 6px;font-size:16px;color:var(--ink);box-shadow:0 4px 0 rgba(34,48,74,.12)}
.tools button.on{background:var(--accent);color:#fff}
.lbl{font-family:var(--fh);font-size:15px;color:#5b6884;display:flex;justify-content:space-between;align-items:center}
.pad{position:relative;aspect-ratio:16/9;border-radius:18px;background:#22304a;touch-action:none;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
.pad::before{content:"在這裡滑動手指，移動聚光燈或雷射筆";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:14px;text-align:center;padding:12px}
.pad i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 14px 4px rgba(255,59,59,.6);left:50%;top:50%}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big button{border:0;border-radius:16px;padding:14px;font-size:17px;background:var(--hot);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.big button.alt{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 rgba(34,48,74,.12)}
#join{display:none;flex-direction:column;gap:12px;background:var(--paper);border-radius:20px;padding:20px;text-align:center}
#join input{font-family:var(--fn);font-size:30px;text-align:center;letter-spacing:.2em;text-transform:uppercase;border:2px solid var(--line);border-radius:14px;padding:8px;width:100%}
#join button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:12px;font-size:18px}
.hide{display:none!important}
</style></head>
<body>
<div id="app">
 <header><b>簡報遙控器</b><span class="st" id="st">連線中…</span></header>
 <div id="join"><b style="font-family:var(--fh);font-weight:400;font-size:22px">輸入電腦上的配對碼</b><input id="code" maxlength="6" autocomplete="off" inputmode="latin" placeholder="ABC123" aria-label="配對碼"><button id="go">連線</button></div>
 <div id="ctl" class="hide">
  <div class="now"><small id="tag">—</small><strong id="title">等待電腦回應…</strong><span class="n" id="num"></span></div>
  <div class="chips" id="chips"></div>
  <div class="nav"><button class="prev" data-a="prev" aria-label="上一頁">◀ 上一頁</button><button data-a="next" aria-label="下一頁">下一頁 ▶</button></div>
  <div class="tools"><button data-a="map">地圖</button><button data-spot="1">聚光燈</button><button data-spot="2">雷射筆</button></div>
  <div class="lbl"><span>指標位置</span><span><button class="tsz" data-d="-40" style="border:0;background:var(--paper);border-radius:10px;padding:4px 12px">－</button> 聚光燈大小 <button class="tsz" data-d="40" style="border:0;background:var(--paper);border-radius:10px;padding:4px 12px">＋</button></span></div>
  <div class="pad" id="pad"><i id="dot"></i></div>
  <div class="big"><button id="zoom">放大指標這一塊</button><button class="alt" data-a="start">開始遊戲</button></div>
  <div class="tools"><button data-spot="0">關閉聚焦</button><button data-a="unzoom">關閉放大</button><button id="fs">畫面不熄滅</button></div>
 </div>
</div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let room=(new URLSearchParams(location.search).get('r')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
let mq=null,state=null,px=.5,py=.5,lastSend=0;
const T=s=>'mattsue1003/deck-dementia/'+room+'/'+s;
function st(t,c){$('#st').textContent=t;$('#st').className='st'+(c?' '+c:'');}
function send(o){if(mq&&mq.connected)mq.publish(T('cmd'),JSON.stringify(o));else st('還沒連上','bad');if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}}
function render(){if(!state)return;$('#tag').textContent=state.map?'地圖':state.tag||'封面';$('#title').textContent=state.map?'全島地圖：點看板跳站':state.title;$('#num').textContent=(state.i+1)+' / '+state.n;
 $('#chips').innerHTML=(state.chs||[]).map((c,i)=>`<button data-ch="${i}" class="${i===state.ch&&!state.map?'on':''}">${c}</button>`).join('');
 document.querySelectorAll('[data-spot]').forEach(b=>b.classList.toggle('on',+b.dataset.spot===state.spot&&state.spot>0));
 $('#zoom').textContent=state.zoom?'關閉放大':'放大指標這一塊';}
function connect(){if(!room){$('#join').style.display='flex';st('需要配對碼');return;}
 $('#join').style.display='none';$('#ctl').classList.remove('hide');st('連線中…');
 mq=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'remote-'+room+'-'+Math.random().toString(16).slice(2,6),reconnectPeriod:2500,connectTimeout:8000});
 mq.on('connect',()=>{st('已連線','ok');mq.subscribe(T('state'));});
 mq.on('message',(t,m)=>{try{state=JSON.parse(m.toString());render();}catch(e){}});
 mq.on('offline',()=>st('離線，重新連線中…','bad'));mq.on('error',()=>st('連線失敗','bad'));}
$('#go').onclick=()=>{room=$('#code').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(room.length<4){st('配對碼不完整','bad');return;}history.replaceState(null,'','?r='+room);connect();};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a)send({a:b.dataset.a});else if(b.dataset.spot!=null)send({a:'spot',m:+b.dataset.spot});else if(b.dataset.ch!=null)send({a:'ch',ch:+b.dataset.ch});else if(b.dataset.d)send({a:'size',d:+b.dataset.d});});
$('#zoom').onclick=e=>{e.stopPropagation();if(state&&state.zoom)send({a:'unzoom'});else send({a:'zoom',x:px,y:py});};
const pad=$('#pad'),dot=$('#dot');
function move(e){const r=pad.getBoundingClientRect();px=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));py=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));dot.style.left=px*100+'%';dot.style.top=py*100+'%';const now=Date.now();if(now-lastSend>45){lastSend=now;send({a:'pt',x:px,y:py});}}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);if(state&&!state.spot)send({a:'spot',m:2});move(e);});
pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e);});
pad.addEventListener('pointerup',e=>send({a:'pt',x:px,y:py}));
let wl=null;$('#fs').onclick=async e=>{e.stopPropagation();try{if(wl){await wl.release();wl=null;$('#fs').classList.remove('on');}else{wl=await navigator.wakeLock.request('screen');$('#fs').classList.add('on');}}catch(err){st('這支手機不支援','bad');}};
if(!window.mqtt){st('無法載入連線元件','bad');}else connect();
</script>
</body></html>
